name: Build Groundwire
on:
  push:
    branches:
      - gw/next/kelvin/408
  pull_request:
    branches:
      - gw/next/kelvin/408

env:
  URBIT_BRANCH: gw/next/kelvin/408
  GROUNDWIRE_BRANCH: hd/consolidate-urb
  SPV_WALLET_BRANCH: develop
  URCRYPT_BRANCH: gw/cmp-pub
  VERE_BRANCH: gw/next/kelvin/408

jobs:
  # =============================================================
  # Build the brass pill on a fake ~zod
  # =============================================================
  build-pill:
    name: Build pill
    runs-on: ubuntu-latest
    env:
      CONN_SOCK: ./zod/.urb/conn.sock
    steps:
      - name: Clean up leftover piers
        run: sudo rm -rf ./zod || true

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install stock Urbit binary
        run: |
          curl -JLO https://urbit.org/install/linux-x86_64/latest
          tar zxvf ./linux-x86_64.tgz
          sudo mv vere-v* /usr/local/bin/urbit
          urbit --version

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd

      - name: Install peru
        run: |
          sudo apt-get install -y pipx
          pipx ensurepath
          pipx install peru
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Boot fake ~zod
        run: |
          urbit -d -F zod -c zod
          echo "Fakeship boot initiated in daemon mode."

      - name: Wait for ~zod to be idle
        run: ./automation/wait-idle.sh "$CONN_SOCK"

      - name: Mount %base desk
        run: ./automation/desk-mount.sh base ./zod "$CONN_SOCK"

      - name: Create and mount %gw-base desk
        run: |
          ./automation/desk-create.sh gw-base "$CONN_SOCK"
          ./automation/desk-mount.sh gw-base ./zod "$CONN_SOCK"

      - name: Checkout gwbtc/urbit
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urbit
          ref: ${{ env.URBIT_BRANCH }}
          path: gwbtc-urbit
          token: ${{ secrets.GH_PAT }}

      - name: Populate %gw-base with pkg/arvo
        run: |
          rsync -av --no-links --checksum \
            --exclude='.git*' --exclude='.ignore' \
            gwbtc-urbit/pkg/arvo/ ./zod/gw-base/

      - name: Checkout gwbtc/groundwire
        uses: actions/checkout@v3
        with:
          repository: gwbtc/groundwire
          ref: ${{ env.GROUNDWIRE_BRANCH }}
          path: gwbtc-groundwire
          token: ${{ secrets.GH_PAT }}

      - name: Build groundwire desk dependencies
        run: |
          cd gwbtc-groundwire
          if [ -f build.sh ]; then
            chmod +x build.sh
            bash build.sh
          elif [ -f peru.yaml ]; then
            peru sync
          fi
          if [ -d dist ]; then
            echo "$(find dist/ -type f | wc -l) files in dist/"
          else
            echo "WARNING: No dist/ directory found after build."
          fi
          cd ..

      - name: Create, mount, and populate %groundwire desk
        run: |
          ./automation/desk-create.sh groundwire "$CONN_SOCK"
          ./automation/desk-mount.sh groundwire ./zod "$CONN_SOCK"
          cp -rv gwbtc-groundwire/dist/* ./zod/groundwire/

      - name: Checkout gwbtc/spv-wallet
        uses: actions/checkout@v3
        with:
          repository: gwbtc/spv-wallet
          ref: ${{ env.SPV_WALLET_BRANCH }}
          path: gwbtc-spv-wallet
          token: ${{ secrets.GH_PAT }}

      - name: Create, mount, and populate %spv-wallet desk
        run: |
          ./automation/desk-create.sh spv-wallet "$CONN_SOCK"
          ./automation/desk-mount.sh spv-wallet ./zod "$CONN_SOCK"
          rsync -av --no-links --checksum \
            --exclude='.git*' --exclude='.ignore' \
            gwbtc-spv-wallet/ ./zod/spv-wallet/

      - name: Validate all desks
        run: |
          echo "gw-base:"
          ls ./zod/gw-base/ | head -10
          echo "groundwire:"
          ls ./zod/groundwire/ | head -10
          echo "spv-wallet:"
          ls ./zod/spv-wallet/ | head -10

      - name: Build brass pill
        run: |
          source ./automation/fyrd.sh

          read -r -d '' BUILD_PILL_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  /lib/pill/hoon  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              =/  sys=path    /(scot %p our)/gw-base/(scot %da now)/sys
              =/  =pill:pill  (brass:pill sys ~ & | | ~)
              ;<  ~  bind:m
                %:  send-raw-card
                    %pass  /build
                    %arvo  %c
                    %info  %gw-base  %&
                    :~  [/pill/pill %ins %pill !>(pill)]
                    ==
                ==
              (pure:m !>('Built pill!'))
              '''
          ==
          HOON

          echo "Triggering brass pill build (fire-and-forget)..."
          fire_and_forget_fyrd "$BUILD_PILL_FYRD"
          echo "Pill build triggered."

      - name: Wait for pill to appear
        timeout-minutes: 30
        run: |
          echo "Polling for pill in ./zod/gw-base/ (up to 30 min)..."
          for i in $(seq 1 600); do
            ./automation/desk-commit.sh gw-base "$CONN_SOCK" > /dev/null 2>&1 || true
            PILL_FILE=$(find ./zod/gw-base/ -name "*.pill" -type f 2>/dev/null | head -1)
            if [ -n "$PILL_FILE" ]; then
              echo "Found pill at: $PILL_FILE"
              cp "$PILL_FILE" ./gw-base.pill
              ls -la ./gw-base.pill
              exit 0
            fi
            if [ $((i % 60)) -eq 0 ]; then
              echo "--- $i iterations elapsed, no pill yet ---"
            fi
          done
          echo "ERROR: Pill never appeared in ./zod/gw-base/."
          find ./zod/gw-base/ -type f 2>/dev/null | head -20 || echo "(empty)"
          exit 1

      - name: Shutdown ~zod
        if: always()
        run: |
          URBIT_PID=$(cat ./zod/.urb/pid 2>/dev/null || true)
          if [ -n "$URBIT_PID" ]; then
            kill "$URBIT_PID" || true
          fi
          sleep 3
          pkill -f "urbit" || true

      - name: Upload pill
        uses: actions/upload-artifact@v4
        with:
          name: gw-base-pill
          path: ./gw-base.pill

  # =============================================================
  # Build vere + comet-miner for each platform
  # =============================================================
  build-binaries:
    name: "Build: ${{ matrix.target }}"
    strategy:
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            zig_archive: zig-x86_64-linux-0.15.2.tar.xz
            zig_014_archive: zig-x86_64-linux-0.14.1.tar.xz
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            zig_archive: zig-aarch64-linux-0.15.2.tar.xz
            zig_014_archive: zig-aarch64-linux-0.14.1.tar.xz
          - target: macos-aarch64
            runner: macos-latest
            zig_archive: zig-aarch64-macos-0.15.2.tar.xz
            zig_014_archive: zig-aarch64-macos-0.14.1.tar.xz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install Zig (0.15.2 for vere, 0.14.1 for comet-miner)
        run: |
          curl -LO "https://ziglang.org/download/0.15.2/${{ matrix.zig_archive }}"
          tar xf "${{ matrix.zig_archive }}"
          ZIG15_DIR="${{ matrix.zig_archive }}"
          ZIG15_DIR="${ZIG15_DIR%.tar.xz}"

          curl -LO "https://ziglang.org/download/0.14.1/${{ matrix.zig_014_archive }}"
          tar xf "${{ matrix.zig_014_archive }}"
          ZIG14_DIR="${{ matrix.zig_014_archive }}"
          ZIG14_DIR="${ZIG14_DIR%.tar.xz}"

          echo "$(pwd)/$ZIG15_DIR" >> $GITHUB_PATH
          echo "ZIG14=$(pwd)/$ZIG14_DIR/zig" >> $GITHUB_ENV

      - name: Verify Zig versions
        run: |
          echo "Zig 0.15.2 (vere):"
          zig version
          echo "Zig 0.14.1 (comet-miner):"
          $ZIG14 version

      - name: Checkout gwbtc/urcrypt
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urcrypt
          ref: ${{ env.URCRYPT_BRANCH }}
          path: gwbtc-urcrypt
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Prepare urcrypt
        run: |
          rm -f gwbtc-urcrypt/build.zig gwbtc-urcrypt/build.zig.zon
          ln -sf $(pwd)/gwbtc-urcrypt $(pwd)/urcrypt
          ls -la $(pwd)/urcrypt/

      - name: Checkout gwbtc/comet-miner
        uses: actions/checkout@v3
        with:
          repository: gwbtc/comet-miner
          path: gwbtc-comet-miner
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Build comet-miner (Zig 0.14.1)
        run: |
          cd gwbtc-comet-miner
          # Fix uint64_t format specifiers for portability (upstream bug)
          sed -i.bak 's/printf("tries: %llu\\n"/printf("tries: %" PRIu64 "\\n"/g' pkg/vere/comet_miner.c
          if ! grep -q '#include <inttypes.h>' pkg/vere/comet_miner.c; then
            sed -i.bak '1s/^/#include <inttypes.h>\n/' pkg/vere/comet_miner.c
          fi
          echo "Building comet-miner for ${{ matrix.target }}..."
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3..."
            if $ZIG14 build -Doptimize=ReleaseFast -Dprogram=comet_miner; then
              echo "Build succeeded on attempt $attempt."
              break
            else
              if [ $attempt -eq 3 ]; then
                echo "All 3 attempts failed."
                exit 1
              fi
              echo "Build failed on attempt $attempt, retrying in 15s..."
              sleep 15
            fi
          done
          MINER_BIN=$(find zig-out -type f -name "comet_miner" 2>/dev/null | head -1)
          if [ -z "$MINER_BIN" ]; then
            MINER_BIN=$(find zig-out -type f -executable 2>/dev/null | head -1)
          fi
          if [ -n "$MINER_BIN" ]; then
            cp "$MINER_BIN" ../comet_miner
          else
            echo "ERROR: comet_miner binary not found in zig-out"
            find zig-out/ -type f 2>/dev/null | head -20
            exit 1
          fi
          cd ..
          chmod +x ./comet_miner
          ls -la ./comet_miner

      - name: Checkout gwbtc/vere
        uses: actions/checkout@v3
        with:
          repository: gwbtc/vere
          ref: ${{ env.VERE_BRANCH }}
          path: gwbtc-vere
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Build vere (Zig 0.15.2)
        run: |
          cd gwbtc-vere
          echo "Building vere for ${{ matrix.target }}..."
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3..."
            if zig build; then
              echo "Build succeeded on attempt $attempt."
              break
            else
              if [ $attempt -eq 3 ]; then
                echo "All 3 attempts failed. Checking if zlib URL is the issue..."
                ZLIB_URL="https://github.com/allyourcodebase/zlib/archive/61e7df7e996ec5a5f13a653db3c419adb340d6ef.tar.gz"
                HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$ZLIB_URL")
                echo "zlib URL returned HTTP $HTTP_CODE"
                if [ "$HTTP_CODE" != "200" ]; then
                  echo "Patching build.zig.zon to use vendored zlib..."
                  mkdir -p ext/zlib-src
                  curl -L -o /tmp/zlib.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
                  tar xzf /tmp/zlib.tar.gz --strip-components=1 -C ext/zlib-src
                  python3 << 'PYEOF'
          import re
          with open('build.zig.zon', 'r') as f:
              content = f.read()
          content = re.sub(
              r'(\.zlib\s*=\s*\.\{)\s*\.url\s*=\s*"[^"]+",\s*\.hash\s*=\s*"[^"]+",',
              r'\1\n            .path = "./ext/zlib-src",',
              content
          )
          with open('build.zig.zon', 'w') as f:
              f.write(content)
          print('Patched build.zig.zon')
          PYEOF
                  zig build || { echo "Build failed even with vendored zlib."; exit 1; }
                else
                  echo "zlib URL is reachable but build still failed."
                  exit 1
                fi
              else
                echo "Build failed on attempt $attempt, retrying in 15s..."
                sleep 15
              fi
            fi
          done

          VERE_BIN=$(find zig-out -type f -executable 2>/dev/null | head -1)
          if [ -z "$VERE_BIN" ]; then
            VERE_BIN=$(find zig-out -type f -name "urbit" -o -type f -name "vere" 2>/dev/null | head -1)
          fi
          if [ -n "$VERE_BIN" ]; then
            cp "$VERE_BIN" ../gw-vere
          else
            echo "ERROR: Binary not found in zig-out"
            find zig-out/ -type f 2>/dev/null | head -20
            exit 1
          fi
          cd ..
          chmod +x ./gw-vere
          ls -la ./gw-vere
          ./gw-vere --version || true

      - name: Upload vere
        uses: actions/upload-artifact@v4
        with:
          name: gw-vere-${{ matrix.target }}
          path: ./gw-vere

      - name: Upload comet-miner
        uses: actions/upload-artifact@v4
        with:
          name: comet-miner-${{ matrix.target }}
          path: ./comet_miner

  # =============================================================
  # Validate the pill boots, then publish release
  # =============================================================
  validate-and-release:
    name: Validate and release
    needs: [build-pill, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download pill
        uses: actions/download-artifact@v4
        with:
          name: gw-base-pill
          path: ./artifacts/pill

      - name: Download vere binaries
        uses: actions/download-artifact@v4
        with:
          pattern: gw-vere-*
          path: ./artifacts/vere

      - name: Download comet-miner binaries
        uses: actions/download-artifact@v4
        with:
          pattern: comet-miner-*
          path: ./artifacts/comet-miner

      - name: Checkout gwbtc/booting
        uses: actions/checkout@v3
        with:
          repository: gwbtc/booting
          path: gwbtc-booting
          token: ${{ secrets.GH_PAT }}

      - name: Prepare release artifacts
        run: |
          cp ./artifacts/pill/gw-base.pill ./gw-base.pill
          ls -la ./gw-base.pill
          echo "Vere binaries:"
          find ./artifacts/vere/ -type f -ls
          echo "Comet-miner binaries:"
          find ./artifacts/comet-miner/ -type f -ls

          sed -i 's|VERE_BIN = .*|VERE_BIN = "./gw-vere"|' gwbtc-booting/gw-onboard.py
          sed -i 's|COMET_MINER_BIN = .*|COMET_MINER_BIN = "./comet_miner"|' gwbtc-booting/gw-onboard.py

          printf 'requests\nembit\n' > requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd

      - name: Boot test ship with pill
        env:
          VERE_BIN: ./gw-vere
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          cp ./artifacts/vere/gw-vere-linux-x86_64/gw-vere ./gw-vere
          chmod +x ./gw-vere
          ./gw-vere -d -F zod -B ./gw-base.pill -c zod2
          ./automation/wait-idle.sh "$CONN_SOCK" "$VERE_BIN"
          echo "Validation successful — ship booted with pill + vere."
          ls -la ./zod2/

      - name: Shutdown test ship
        if: always()
        run: |
          ZOD2_PID=$(cat ./zod2/.urb/pid 2>/dev/null || true)
          if [ -n "$ZOD2_PID" ]; then
            kill "$ZOD2_PID" || true
          fi
          sleep 3
          pkill -f "gw-vere" || true

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh
          fi
          gh --version

      - name: Package and publish release
        run: |
          for target in linux-x86_64 linux-aarch64 macos-aarch64; do
            mkdir -p "pkg-${target}"
            cp ./gw-base.pill "pkg-${target}/"
            cp "./artifacts/vere/gw-vere-${target}/gw-vere" "pkg-${target}/gw-vere"
            cp "./artifacts/comet-miner/comet-miner-${target}/comet_miner" "pkg-${target}/comet_miner"
            chmod +x "pkg-${target}/gw-vere" "pkg-${target}/comet_miner"
            cp gwbtc-booting/gw-onboard.py "pkg-${target}/"
            cp requirements.txt "pkg-${target}/"
            tar czf "groundwire-${target}.tar.gz" -C "pkg-${target}" .
          done

          # Build date-based release tag with increment for same-day releases
          DATE_BASE=$(date -u +"%Y.%-m.%-d")
          TAG="groundwire-alpha-${DATE_BASE}"
          TITLE="groundwire-alpha ${DATE_BASE}"
          SUFFIX=2
          while gh release view "$TAG" --repo gwbtc/urbit &>/dev/null; do
            TAG="groundwire-alpha-${DATE_BASE}_${SUFFIX}"
            TITLE="groundwire-alpha ${DATE_BASE}_${SUFFIX}"
            SUFFIX=$((SUFFIX + 1))
          done

          gh release create "$TAG" \
            groundwire-linux-x86_64.tar.gz \
            groundwire-linux-aarch64.tar.gz \
            groundwire-macos-aarch64.tar.gz \
            --repo gwbtc/urbit \
            --title "$TITLE" \
            --notes "Automated build from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA})

          Each tarball contains everything needed to onboard:
          - \`gw-vere\` — Urbit runtime
          - \`gw-base.pill\` — Brass pill
          - \`comet_miner\` — Comet miner
          - \`gw-onboard.py\` — Onboarding script
          - \`requirements.txt\` — Python dependencies (\`pip install -r requirements.txt\`)

          Usage: \`tar xzf groundwire-<platform>.tar.gz && pip install -r requirements.txt && python3 gw-onboard.py\`
          - \`groundwire-linux-x86_64.tar.gz\`
          - \`groundwire-linux-aarch64.tar.gz\`
          - \`groundwire-macos-aarch64.tar.gz\`"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
