
name: vere

on:
  workflow_call:
    inputs:
      upload:
        description: 'upload binaries to gcp'
        type: boolean
        default: false
        required: false
      pace:
        description: 'release pace'
        type: string
        default: 'edge'
        required: false
      next:
        description: 'next kelvin version branch name'
        type: string
        default: null
        required: false
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      GCP_CREDENTIALS:
        required: false
      GCS_SERVICE_ACCOUNT_KEY:
        required: false
      GCS_PROJECT:
        required: false

  workflow_dispatch:
    inputs:
      upload:
        description: 'upload binaries to gcp'
        type: boolean
        default: false
        required: false
      pace:
        description: 'release pace'
        type: choice
        options:
        - edge
        - soon
        - live

jobs:
  urbit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, type: linux }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # We only want the extra nix config on linux, where it is necessary
      # for the docker build. We don't want in on Mac, where it isn't but
      # it breaks the nix install. The two `if` clauses should be mutually
      # exclusive
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
        if: ${{ matrix.type == 'linux' }}
      - uses: cachix/install-nix-action@v27
        if: ${{ matrix.os != 'ubuntu-latest' }}

      - uses: cachix/cachix-action@v15
        with:
          name: ares
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      #  build groundwire's vere; kelvin branches pair with the matching
      #  gwbtc/vere branch, all else uses its default branch
      #
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: pick vere branch
        id: vere
        run: |
          ref=""
          for b in "${{ inputs.next }}" "${{ github.head_ref }}" "${{ github.ref_name }}"; do
            if [[ "$b" == *next/kelvin/* ]]; then
              ref="gw/next/kelvin/${b##*/}"
              break
            fi
          done
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/checkout@v4
        with:
          repository: gwbtc/vere
          ref: ${{ steps.vere.outputs.ref }}
          path: .vere/vere

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/checkout@v4
        with:
          repository: gwbtc/urcrypt
          ref: gw/cmp-pub
          path: .vere/urcrypt

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: build vere
        run: |
          #  vere's ext/urcrypt builds these sources itself
          rm -f .vere/urcrypt/build.zig .vere/urcrypt/build.zig.zon
          cd .vere/vere
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl
          cp zig-out/x86_64-linux-musl/urbit ../../urbit
          cd ../..
          chmod +x urbit
          ./urbit --version

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: run urbit-tests
        run: |
          git add urbit

          nix flake check --keep-build-log -L
