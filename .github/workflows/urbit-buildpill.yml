name: Urbit Fakeship CI/CD - Groundwire
on:
  push:
    branches:
      - gw/next/kelvin/408
  pull_request:
    branches:
      - gw/next/kelvin/408
jobs:
  boot-fakeship-and-create-desk:
    runs-on: self-hosted
    env:
      URBIT_SHIP: zod
      DESK_NAME: gw-base
      PIER: ./zod
      CONN_SOCK: ./zod/.urb/conn.sock
    steps:
      # -------------------------------------------------------
      # 0. Clean up any leftover piers from previous runs
      # -------------------------------------------------------
      - name: Clean up leftover piers
        run: |
          echo "Cleaning up any leftover piers..."
          sudo rm -rf ./zod ./zod2 || true
          echo "Done."

      # -------------------------------------------------------
      # 1. Checkout Repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------------------------------------------
      # 2. Install Urbit Binary
      # -------------------------------------------------------
      - name: Install Urbit binary
        run: |
          curl -JLO https://urbit.org/install/linux-x86_64/latest
          tar zxvf ./linux-x86_64.tgz
          sudo mv vere-v* /usr/local/bin/urbit
          urbit --version

      # -------------------------------------------------------
      # 3. Install dependencies
      # -------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd

      # -------------------------------------------------------
      # 4. Install peru
      # -------------------------------------------------------
      - name: Install peru
        run: |
          sudo apt-get install -y pipx
          pipx ensurepath
          pipx install peru
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # -------------------------------------------------------
      # 5. Boot Urbit Fakeship (~zod) in daemon mode
      # -------------------------------------------------------
      - name: Boot fake ~zod ship
        run: |
          urbit -d -F zod -c zod
          echo "Fakeship boot initiated in daemon mode."

      # -------------------------------------------------------
      # 6. Wait for fakeship to be fully idle
      # -------------------------------------------------------
      - name: Wait for fakeship to be idle
        run: |
          FYRD=":*  0
                    %fyrd
                    %base
                    %khan-eval
                    %noun
                    %ted-eval
                    :_  ~
                    '''
                    =/  m  (strand ,vase)
                    (pure:m !>('Success!'))
                    '''
                =="

          echo "Polling ship until idle..."
          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."
            RESULT=$(echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true)
            echo "Result: $RESULT"
            if echo "$RESULT" | grep -q "%avow"; then
              echo "Ship is idle and responsive after $((i * 10)) seconds."
              exit 0
            fi
            echo "Ship not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Ship never became idle after 600 seconds."
          exit 1

      # -------------------------------------------------------
      # 7. Mount base desk
      # -------------------------------------------------------
      - name: Mount base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }
          MOUNT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            %:  poke-our
                                %hood
                                %kiln-mount
                                !>([(en-beam [[our %base [%da now]] /]) %base])
                            ==
                          (pure:m !>(~))
                          '''
                      =="
          echo "Mounting base desk..."
          RESULT=$(send_fyrd "$MOUNT_FYRD")
          sleep 5
          if [ -d "./zod/base" ]; then
            echo "Base desk mounted successfully."
          else
            echo "ERROR: Failed to mount base desk"
            exit 1
          fi

      # -------------------------------------------------------
      # 8. Create gw-base as full copy of base
      # -------------------------------------------------------
      - name: Create gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' MERGE_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)  ^-  form:m
              ;<  our=@p  bind:m  get-our
              ;<  now=@da  bind:m  get-time
              ;<  ~  bind:m
                (poke-our %hood %kiln-merge !>([%gw-base our %base [%da now] %init]))
              (pure:m !>('Merge sent!'))
              '''
          ==
          HOON

          echo "Creating gw-base desk via merge..."
          RESULT=$(send_fyrd "$MERGE_FYRD")
          echo "Result: $RESULT"

      # -------------------------------------------------------
      # 9. Mount gw-base desk (poll until merge completes)
      # -------------------------------------------------------
      - name: Mount gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' MOUNT_GW_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)  ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              ;<  ~  bind:m
                %:  poke-our  %hood  %kiln-mount
                    !>([(en-beam [[our %gw-base [%da now]] /]) %gw-base])  ==
              (pure:m !>(~))
              '''
          ==
          HOON

          echo "Polling to mount gw-base (up to 3 min for merge to complete)..."
          for i in $(seq 1 18); do
            RESULT=$(send_fyrd "$MOUNT_GW_FYRD")
            sleep 5
            if [ -e "./zod/gw-base/sys.kelvin" ]; then
              echo "gw-base mounted successfully (attempt $i)."
              break
            fi
            if [ $i -eq 18 ]; then
              echo "ERROR: gw-base never mounted after 18 attempts"
              exit 1
            fi
            echo "  attempt $i: not yet, waiting 10s..."
            sleep 10
          done

      # -------------------------------------------------------
      # 10. Checkout gwbtc/urbit and copy pkg/arvo/* into gw-base
      # -------------------------------------------------------
      - name: Checkout gwbtc/urbit
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urbit
          ref: gw/next/kelvin/408
          path: gwbtc-urbit
          token: ${{ secrets.GH_PAT }}
      - name: Copy pkg/arvo into gw-base desk
        run: |
          echo "Copying gwbtc/urbit pkg/arvo changes into gw-base desk..."
          # Only copy files that differ from base; skip symlinks (dangling base-dev refs)
          rsync -av --no-links --checksum \
            --exclude='.git*' --exclude='.ignore' \
            gwbtc-urbit/pkg/arvo/ ./zod/gw-base/
          echo "Done."

      # -------------------------------------------------------
      # 11. Commit gw-base desk
      # -------------------------------------------------------
      - name: Commit gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' COMMIT_FYRD << 'HOON' || true
          :*  0
              %fyrd
              %base
              %khan-eval
              %noun
              %ted-eval
              :_  :~  /sur/spider/hoon
                      /lib/strandio/hoon
                  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  ~  bind:m
                (poke-our %hood %kiln-commit !>([%gw-base %.n]))
              (pure:m !>('Commit sent!'))
              '''
          ==
          HOON

          echo "Committing gw-base desk..."
          RESULT=$(send_fyrd "$COMMIT_FYRD")
          echo "Result: $RESULT"
          sleep 10

      # -------------------------------------------------------
      # 12. Build brass pill from gw-base (fire and forget)
      # -------------------------------------------------------
      - name: Trigger brass pill build
        run: |
          read -r -d '' BUILD_PILL_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  /lib/pill/hoon  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              =/  sys=path    /(scot %p our)/gw-base/(scot %da now)/sys
              =/  =pill:pill  (brass:pill sys ~ & | | ~)
              ;<  ~  bind:m
                %:  send-raw-card
                    %pass  /build
                    %arvo  %c
                    %info  %gw-base  %&
                    :~  [/pill/pill %ins %pill !>(pill)]
                    ==
                ==
              (pure:m !>('Built pill!'))
              '''
          ==
          HOON

          echo "Triggering brass pill build (fire-and-forget, build may take up to 15 min)..."
          echo "$BUILD_PILL_FYRD" | urbit eval -jn 2>/dev/null | \
            nc -U -W 1 $CONN_SOCK 2>/dev/null > /dev/null &
          echo "Pill build triggered."

      # -------------------------------------------------------
      # 13. Wait for pill to appear in ./zod/gw-base/
      # -------------------------------------------------------
      - name: Wait for pill build output
        timeout-minutes: 30
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' COMMIT_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  ~  bind:m
                (poke-our %hood %kiln-commit !>([%gw-base %.n]))
              (pure:m !>('Commit sent!'))
              '''
          ==
          HOON

          echo "Polling for pill in ./zod/gw-base/ (up to 30 min)..."
          for i in $(seq 1 600); do
            send_fyrd "$COMMIT_FYRD" > /dev/null 2>&1 || true
            PILL_FILE=$(find ./zod/gw-base/ -name "*.pill" -type f 2>/dev/null | head -1)
            if [ -n "$PILL_FILE" ]; then
              echo "Found pill at: $PILL_FILE"
              cp "$PILL_FILE" ./gw-base.pill
              ls -la ./gw-base.pill
              exit 0
            fi
            if [ $((i % 60)) -eq 0 ]; then
              echo "--- $i iterations elapsed, no pill yet ---"
            fi
          done
          echo "ERROR: Pill never appeared in ./zod/gw-base/."
          find ./zod/gw-base/ -type f 2>/dev/null | head -20 || echo "(empty)"
          exit 1

      # -------------------------------------------------------
      # 14. Shutdown first fakeship
      # -------------------------------------------------------
      - name: Shutdown first fakeship
        run: |
          echo "Shutting down first fakeship..."
          URBIT_PID=$(cat ./zod/.urb/pid 2>/dev/null || true)
          if [ -n "$URBIT_PID" ]; then
            kill "$URBIT_PID" || true
            echo "Sent kill to PID $URBIT_PID"
          fi
          sleep 5

      # -------------------------------------------------------
      # 15. Install Zig
      # -------------------------------------------------------
      - name: Install Zig
        run: |
          if zig version 2>/dev/null | grep -q "0.15.2"; then
            echo "zig 0.15.2 already installed, skipping."
          else
            curl -LO https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
            tar xf zig-x86_64-linux-0.15.2.tar.xz
            sudo mv zig-x86_64-linux-0.15.2/zig /usr/local/bin/
            sudo rm -rf /usr/local/lib/zig
            sudo mv zig-x86_64-linux-0.15.2/lib /usr/local/lib/zig
          fi
          zig version

      # -------------------------------------------------------
      # 16. Checkout gwbtc/urcrypt
      # -------------------------------------------------------
      - name: Checkout gwbtc/urcrypt
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urcrypt
          ref: gw/cmp-pub
          path: gwbtc-urcrypt
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Remove urcrypt zig build files
        run: |
          rm -f gwbtc-urcrypt/build.zig gwbtc-urcrypt/build.zig.zon
          echo "Removed build.zig and build.zig.zon from urcrypt"

      # -------------------------------------------------------
      # 17. Checkout gwbtc/vere
      # -------------------------------------------------------
      - name: Checkout gwbtc/vere
        uses: actions/checkout@v3
        with:
          repository: gwbtc/vere
          ref: gw/next/kelvin/408
          path: gwbtc-vere
          token: ${{ secrets.GH_PAT || github.token }}

      # -------------------------------------------------------
      # 18. Setup urcrypt as sibling to vere
      # -------------------------------------------------------
      - name: Setup urcrypt for vere build
        run: |
          ln -sf $(pwd)/gwbtc-urcrypt $(pwd)/gwbtc-vere/../urcrypt
          ls -la $(pwd)/gwbtc-vere/../urcrypt/

      # -------------------------------------------------------
      # 19. Build gwbtc/vere with zig build
      # -------------------------------------------------------
      - name: Build gwbtc/vere
        run: |
          cd gwbtc-vere
          echo "Building gwbtc/vere with zig build..."
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3..."
            if zig build; then
              echo "Build succeeded on attempt $attempt."
              break
            else
              if [ $attempt -eq 3 ]; then
                echo "All 3 attempts failed. Checking if zlib URL is the issue..."
                ZLIB_URL="https://github.com/allyourcodebase/zlib/archive/61e7df7e996ec5a5f13a653db3c419adb340d6ef.tar.gz"
                HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$ZLIB_URL")
                echo "zlib URL returned HTTP $HTTP_CODE"
                if [ "$HTTP_CODE" != "200" ]; then
                  echo "Patching build.zig.zon to use vendored zlib..."
                  mkdir -p ext/zlib-src
                  curl -L -o /tmp/zlib.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
                  tar xzf /tmp/zlib.tar.gz --strip-components=1 -C ext/zlib-src
                  python3 << 'PYEOF'
          import re
          with open('build.zig.zon', 'r') as f:
              content = f.read()
          content = re.sub(
              r'(\.zlib\s*=\s*\.\{)\s*\.url\s*=\s*"[^"]+",\s*\.hash\s*=\s*"[^"]+",',
              r'\1\n            .path = "./ext/zlib-src",',
              content
          )
          with open('build.zig.zon', 'w') as f:
              f.write(content)
          print('Patched build.zig.zon')
          PYEOF
                  zig build || { echo "Build failed even with vendored zlib."; exit 1; }
                else
                  echo "zlib URL is reachable but build still failed."
                  exit 1
                fi
              else
                echo "Build failed on attempt $attempt, retrying in 15s..."
                sleep 15
              fi
            fi
          done

          VERE_BIN=$(find zig-out -type f -executable 2>/dev/null | head -1)
          if [ -n "$VERE_BIN" ]; then
            cp "$VERE_BIN" ../gw-vere
          else
            echo "Binary not found in zig-out, searching..."
            find . -name "urbit" -o -name "vere" -type f 2>/dev/null | head -20
            exit 1
          fi
          cd ..
          chmod +x ./gw-vere
          echo "gwbtc/vere built successfully:"
          ls -la ./gw-vere
          ./gw-vere --version || true

      # -------------------------------------------------------
      # 20. Boot new fakeship with gw-base pill using gwbtc/vere
      # -------------------------------------------------------
      - name: Boot new fakeship with gw-base pill
        run: |
          if [ -f ./gw-base.pill ]; then
            ./gw-vere -d -F zod -B ./gw-base.pill -c zod2 -p 31338 --http-port 8081
          else
            echo "WARNING: No pill found, booting with default pill."
            ./gw-vere -d -F zod -c zod2 -p 31338 --http-port 8081
          fi
          echo "Second fakeship boot initiated in daemon mode."

      # -------------------------------------------------------
      # 21. Wait for second fakeship to be idle
      # -------------------------------------------------------
      - name: Wait for second fakeship to be idle
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          FYRD=":*  0
                    %fyrd
                    %base
                    %khan-eval
                    %noun
                    %ted-eval
                    :_  ~
                    '''
                    =/  m  (strand ,vase)
                    (pure:m !>('Success!'))
                    '''
                =="

          echo "Polling second ship until idle..."
          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."
            RESULT=$(echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true)
            echo "Result: $RESULT"
            if echo "$RESULT" | grep -q "%avow"; then
              echo "Second ship is idle and responsive after $((i * 10)) seconds."
              exit 0
            fi
            echo "Ship not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Second ship never became idle after 600 seconds."
          exit 1

      # -------------------------------------------------------
      # 22. Create %groundwire desk on new ship
      # -------------------------------------------------------
      - name: Create groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }

          read -r -d '' MERGE_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)  ^-  form:m
              ;<  our=@p  bind:m  get-our
              ;<  now=@da  bind:m  get-time
              ;<  ~  bind:m
                (poke-our %hood %kiln-merge !>([%groundwire our %base [%da now] %init]))
              (pure:m !>('Merge sent!'))
              '''
          ==
          HOON

          echo "Creating groundwire desk via merge..."
          RESULT=$(send_fyrd "$MERGE_FYRD")
          echo "Result: $RESULT"

      # -------------------------------------------------------
      # 23. Mount %groundwire desk (poll until merge completes)
      # -------------------------------------------------------
      - name: Mount groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }

          read -r -d '' MOUNT_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)  ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              ;<  ~  bind:m
                %:  poke-our  %hood  %kiln-mount
                    !>([(en-beam [[our %groundwire [%da now]] /]) %groundwire])  ==
              (pure:m !>(~))
              '''
          ==
          HOON

          echo "Polling to mount groundwire (up to 3 min for merge to complete)..."
          for i in $(seq 1 18); do
            RESULT=$(send_fyrd "$MOUNT_FYRD")
            sleep 5
            if [ -e "./zod2/groundwire/sys.kelvin" ]; then
              echo "groundwire mounted successfully (attempt $i)."
              cat ./zod2/groundwire/sys.kelvin
              break
            fi
            if [ $i -eq 18 ]; then
              echo "ERROR: groundwire never mounted after 18 attempts"
              exit 1
            fi
            echo "  attempt $i: not yet, waiting 10s..."
            sleep 10
          done

      # -------------------------------------------------------
      # 24. Checkout gwbtc/groundwire and build dependencies
      # -------------------------------------------------------
      - name: Checkout gwbtc/groundwire
        uses: actions/checkout@v3
        with:
          repository: gwbtc/groundwire
          ref: gw/next/kelvin/408
          path: gwbtc-groundwire
          token: ${{ secrets.GH_PAT }}

      - name: Build groundwire dependencies with peru
        run: |
          cd gwbtc-groundwire
          if [ -f build.sh ]; then
            chmod +x build.sh
            bash build.sh
            echo "Build script completed."
          else
            echo "WARNING: No build.sh found. Checking for peru.yaml..."
            if [ -f peru.yaml ]; then
              peru sync
            fi
          fi
          if [ -d dist ]; then
            echo "dist/ directory contents:"
            find dist/ -type f | head -50
            echo "..."
            find dist/ -type f | wc -l
            echo "total files in dist/"
          else
            echo "WARNING: No dist/ directory found after build."
          fi
          cd ..

      # -------------------------------------------------------
      # 25. Copy groundwire dist into mounted desk
      # -------------------------------------------------------
      - name: Copy groundwire dist into mounted desk
        run: |
          if [ -d gwbtc-groundwire/dist ]; then
            echo "Copying groundwire dist/* into mounted groundwire desk..."
            cp -rv gwbtc-groundwire/dist/* ./zod2/groundwire/
            echo "Contents of groundwire desk after copy:"
            find ./zod2/groundwire/ -type f | head -50
            echo "..."
            find ./zod2/groundwire/ -type f | wc -l
            echo "total files"
          else
            echo "ERROR: No dist/ directory to copy from."
            exit 1
          fi

      # -------------------------------------------------------
      # 26. Commit %groundwire desk
      # -------------------------------------------------------
      - name: Commit groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }

          COMMIT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  ~
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  ~  bind:m
                            (poke-our %hood %kiln-commit !>([%groundwire %.n]))
                          (pure:m !>('Commit successful!'))
                          '''
                      =="

          echo "Committing groundwire desk..."
          RESULT=$(send_fyrd "$COMMIT_FYRD")
          echo "Result: $RESULT"
          sleep 10

      # -------------------------------------------------------
      # 27. Install %groundwire desk
      # -------------------------------------------------------
      - name: Install groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }

          INSTALL_FYRD=":*  0
                            %fyrd
                            %base
                            %khan-eval
                            %noun
                            %ted-eval
                            :_  ~
                            '''
                            =/  m  (strand ,vase)
                            ^-  form:m
                            ;<  our=@p  bind:m  get-our
                            ;<  ~  bind:m
                              (poke-our %hood %kiln-install !>([%groundwire our %groundwire]))
                            (pure:m !>('Install successful!'))
                            '''
                        =="

          echo "Installing groundwire desk..."
          RESULT=$(send_fyrd "$INSTALL_FYRD")
          echo "Result: $RESULT"
          sleep 10

      # -------------------------------------------------------
      # 28. Validate groundwire desk
      # -------------------------------------------------------
      - name: Validate groundwire desk structure
        run: |
          echo "Validating groundwire desk contents..."
          ls -la ./zod2/groundwire/
          echo "Desk validation complete."

      # -------------------------------------------------------
      # 29. Package and publish pill + vere to gwbtc/urbit releases
      # -------------------------------------------------------
      - name: Publish release artifacts
        run: |
          tar czf gw-base-release.tar.gz gw-base.pill gw-vere
          gh release create "build-${GITHUB_SHA:0:8}" gw-base-release.tar.gz \
            --repo gwbtc/urbit \
            --title "Build ${GITHUB_SHA:0:8}" \
            --notes "Automated build from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA})"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # -------------------------------------------------------
      # 30. Cleanup - shut down fakeships
      # -------------------------------------------------------
      - name: Shutdown fakeships
        if: always()
        run: |
          echo "Shutting down fakeships..."
          ZOD2_PID=$(cat ./zod2/.urb/pid 2>/dev/null || true)
          if [ -n "$ZOD2_PID" ]; then
            kill "$ZOD2_PID" || true
            echo "Sent kill to zod2 PID $ZOD2_PID"
          fi
          ZOD_PID=$(cat ./zod/.urb/pid 2>/dev/null || true)
          if [ -n "$ZOD_PID" ]; then
            kill "$ZOD_PID" || true
            echo "Sent kill to zod PID $ZOD_PID"
          fi
          sleep 5
          pkill -f "urbit" || true
          pkill -f "gw-vere" || true
          echo "Done."
