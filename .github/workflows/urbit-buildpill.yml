name: Urbit Fakeship CI/CD - buildpill Desk
on:
  push:
    branches:
      - gw/next/kelvin/408
  pull_request:
    branches:
      - gw/next/kelvin/408
jobs:
  boot-fakeship-and-create-desk:
    runs-on: ubuntu-latest
    env:
      URBIT_SHIP: zod
      DESK_NAME: buildpill
      PIER: ./zod
      CONN_SOCK: ./zod/.urb/conn.sock
    steps:
      # -------------------------------------------------------
      # 1. Checkout Repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------------------------------------------
      # 2. Install DigitalOcean CLI (doctl)
      # -------------------------------------------------------
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # -------------------------------------------------------
      # 3. Install Urbit Binary
      # -------------------------------------------------------
      - name: Install Urbit binary
        run: |
          curl -JLO https://urbit.org/install/linux-x86_64/latest
          tar zxvf ./linux-x86_64.tgz
          sudo mv vere-v* /usr/local/bin/urbit
          urbit --version

      # -------------------------------------------------------
      # 4. Install netcat
      # -------------------------------------------------------
      - name: Install netcat
        run: |
          sudo apt-get install -y netcat-openbsd

      # -------------------------------------------------------
      # 5. Boot Urbit Fakeship (~zod)
      # -------------------------------------------------------
      - name: Boot fake ~zod ship
        run: |
          urbit -d -F zod -c zod
          echo "Fakeship boot initiated in daemon mode."

      # -------------------------------------------------------
      # 6. Wait for fakeship to be fully idle
      # -------------------------------------------------------
      - name: Wait for fakeship to be idle
        run: |
          FYRD=":*  0
                    %fyrd
                    %base
                    %khan-eval
                    %noun
                    %ted-eval
                    :_  ~
                    '''
                    =/  m  (strand ,vase)
                    (pure:m !>('Success!'))
                    '''
                =="

          echo "Polling ship until idle..."
          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."

            RESULT=$(echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true)

            echo "Result: $RESULT"

            if echo "$RESULT" | grep -q "%avow"; then
              echo "Ship is idle and responsive after $((i * 10)) seconds."
              exit 0
            fi

            echo "Ship not ready yet, waiting 10s..."
            sleep 10
          done

          echo "ERROR: Ship never became idle after 600 seconds."
          exit 1

      # -------------------------------------------------------
      # 7. Create new desk called 'buildpill'
      # -------------------------------------------------------
      - name: Create buildpill desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          NEW_DESK_FYRD=":*  0
                             %fyrd
                             %base
                             %khan-eval
                             %noun
                             %ted-eval
                             :_  :~  /sur/spider/hoon
                                     /lib/strandio/hoon
                                 ==
                             '''
                             /-  spider
                             /+  *strandio
                             =/  m  (strand ,vase)
                             ^-  form:m
                             ;<  =beak  bind:m  get-beak
                             ;<  ~  bind:m
                               %:  send-raw-card
                                   %pass   /make-new-desk
                                   %agent  [p.beak %hood]
                                   %poke   %helm-pass
                                   !>  ^-  note-arvo
                                   %^    new-desk:cloy
                                       %buildpill
                                     ~
                                   %-  ~(gas by *(map path page:clay))
                                   |^  =-  (turn - mage)
                                       ^-  (list path)
                                       =/  common-files=(list path)
                                         :~
                                           /mar/noun/hoon
                                           /mar/hoon/hoon
                                           /mar/txt/hoon
                                           /mar/kelvin/hoon
                                           /sys/kelvin
                                         ==
                                       =/  extra-files=(list path)
                                         :~
                                           /mar/bill/hoon
                                           /mar/mime/hoon
                                           /mar/json/hoon
                                           /lib/skeleton/hoon
                                           /lib/default-agent/hoon
                                           /lib/dbug/hoon
                                         ==
                                       (weld common-files extra-files)
                                   ::
                                   ++  mage
                                     |=  =path
                                     :-  path
                                     ^-  page:clay
                                     :-  (rear path)
                                     ~|  [%missing-source-file %base path]
                                     .^  *
                                       %cx
                                       (scot %p p.beak)
                                       %base
                                       (scot %da p.r.beak)
                                       path
                                     ==
                                   --
                               ==
                             (pure:m !>('Created desk!'))
                             '''
                         =="
          echo "Creating buildpill desk..."
          RESULT=$(send_fyrd "$NEW_DESK_FYRD")
          echo "Result: $RESULT"
          sleep 5

      - name: Mount buildpill desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          MOUNT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                              /lib/strandio/hoon
                          ==
                          '''
                          /-  spider
                          /+  *strandio
                          =,  strand=strand:spider
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            %:  poke-our
                                %hood
                                %kiln-mount
                                !>([(en-beam [[our %buildpill [%da now]] /]) %buildpill])
                            ==
                          (pure:m !>(~))
                          '''
                      =="

          echo "Mounting buildpill desk..."
          RESULT=$(send_fyrd "$MOUNT_FYRD")

          sleep 5
          if [ -e "./zod/buildpill/sys.kelvin" ]; then
            echo "Desk mounted successfully."
            cat ./zod/buildpill/sys.kelvin
          else
            echo "ERROR: Failed to mount desk - $RESULT"
          fi

      # -------------------------------------------------------
      # 8. Validate buildpill desk structure
      # -------------------------------------------------------
      - name: Validate buildpill desk structure
        run: |
          echo "Validating buildpill desk contents..."
          ls -la ./zod/buildpill/
          echo "Desk validation complete."

      # -------------------------------------------------------
      # 9. Build & Push Docker Image to DO Registry
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-buildpill:${{ github.sha }} .

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Push image to DigitalOcean Container Registry
        run: |
          docker push registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-buildpill:${{ github.sha }}

      # -------------------------------------------------------
      # 10. Deploy to DigitalOcean Kubernetes
      # -------------------------------------------------------
      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/urbit-buildpill \
            urbit-buildpill=registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-buildpill:${{ github.sha }}

      # -------------------------------------------------------
      # 11. Cleanup - shut down fakeship
      # -------------------------------------------------------
      - name: Shutdown fakeship
        if: always()
        run: |
          echo "Shutting down fakeship..."
          URBIT_PID=$(cat ./zod/.urb/pid 2>/dev/null || true)
          if [ -n "$URBIT_PID" ]; then
            kill $URBIT_PID || true
            echo "Killed fakeship PID $URBIT_PID"
          else
            echo "No PID file found, trying pkill..."
            pkill -f "urbit" || true
          fi
          echo "Done."
