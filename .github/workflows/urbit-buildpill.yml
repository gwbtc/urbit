name: Urbit Fakeship CI/CD - Groundwire
on:
  push:
    branches:
      - gw/next/kelvin/408
  pull_request:
    branches:
      - gw/next/kelvin/408
jobs:
  boot-fakeship-and-create-desk:
    runs-on: self-hosted
    env:
      URBIT_SHIP: zod
      DESK_NAME: gw-base
      PIER: ./zod
      CONN_SOCK: ./zod/.urb/conn.sock
      TMUX_SOCK: /tmp/tmux-runner
    steps:
      # -------------------------------------------------------
      # 0. Clean up any leftover piers from previous runs
      # -------------------------------------------------------
      - name: Clean up leftover piers
        run: |
          echo "Cleaning up any leftover piers..."
          sudo rm -rf ./zod ./zod2 || true
          # Clean up stale tmux sockets
          sudo rm -rf /tmp/tmux-* || true
          echo "Done."

      # -------------------------------------------------------
      # 1. Checkout Repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------------------------------------------
      # 2. Install DigitalOcean CLI (doctl)
      # -------------------------------------------------------
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # -------------------------------------------------------
      # 3. Install Urbit Binary
      # -------------------------------------------------------
      - name: Install Urbit binary
        run: |
          curl -JLO https://urbit.org/install/linux-x86_64/latest
          tar zxvf ./linux-x86_64.tgz
          sudo mv vere-v* /usr/local/bin/urbit
          urbit --version

      # -------------------------------------------------------
      # 4. Install netcat and tmux
      # -------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get install -y netcat-openbsd tmux

      # -------------------------------------------------------
      # 5. Install peru
      # -------------------------------------------------------
      - name: Install peru
        run: |
          sudo apt-get install -y pipx
          pipx ensurepath
          pipx install peru
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # -------------------------------------------------------
      # 6. Boot Urbit Fakeship (~zod)
      # -------------------------------------------------------
      - name: Boot fake ~zod ship
        run: |
          tmux -S $TMUX_SOCK new-session -d -s urbit-zod -x 220 -y 50
          tmux -S $TMUX_SOCK send-keys -t urbit-zod "urbit -t -F zod -c zod 2>&1 | tee ./urbit-boot.log" Enter
          echo "Fakeship booting in tmux session 'urbit-zod'."

      - name: Fix pier permissions
        run: |
          sleep 5
          sudo chown -R $(whoami):$(whoami) ./zod || true
          echo "Pier permissions fixed."

      # -------------------------------------------------------
      # 7. Wait for fakeship to be fully idle
      # -------------------------------------------------------
      - name: Wait for fakeship to be idle
        run: |
          FYRD=":*  0
                    %fyrd
                    %base
                    %khan-eval
                    %noun
                    %ted-eval
                    :_  ~
                    '''
                    =/  m  (strand ,vase)
                    (pure:m !>('Success!'))
                    '''
                =="

          echo "Polling ship until idle..."
          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."
            tail -1 ./urbit-boot.log 2>/dev/null || true
            RESULT=$(echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true)
            echo "Result: $RESULT"
            if echo "$RESULT" | grep -q "%avow"; then
              echo "Ship is idle and responsive after $((i * 10)) seconds."
              exit 0
            fi
            echo "Ship not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Ship never became idle after 600 seconds."
          echo "=== Last 20 lines of boot log ==="
          tail -20 ./urbit-boot.log 2>/dev/null || true
          exit 1

            # -------------------------------------------------------
      # 8. Mount base desk
      # -------------------------------------------------------
      - name: Mount base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }
          MOUNT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            %:  poke-our
                                %hood
                                %kiln-mount
                                !>([(en-beam [[our %base [%da now]] /]) %base])
                            ==
                          (pure:m !>(~))
                          '''
                      =="
          echo "Mounting base desk..."
          RESULT=$(send_fyrd "$MOUNT_FYRD")
          sleep 5
          if [ -d "./zod/base" ]; then
            echo "Base desk mounted successfully."
            find ./zod/base/ -type f | wc -l
            echo "files in base"
          else
            echo "ERROR: Failed to mount base desk"
            exit 1
          fi
      # -------------------------------------------------------
      # 9. Create gw-base as full copy of base
      # -------------------------------------------------------
      - name: Create gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }
          MERGE_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  =beak  bind:m  get-beak
                          ;<  ~  bind:m
                            %:  send-raw-card
                                %pass   /make-new-desk
                                %agent  [p.beak %hood]
                                %poke   %helm-pass
                                !>  ^-  note-arvo
                                [%c %merg %gw-base [p.beak %base q.r.beak] %init ~]
                            ==
                          (pure:m !>('Created desk!'))
                          '''
                      =="
          echo "Creating gw-base desk as full copy of base..."
          RESULT=$(send_fyrd "$MERGE_FYRD")
          echo "Result: $RESULT"
          sleep 10
      # -------------------------------------------------------
      # 10. Mount gw-base desk
      # -------------------------------------------------------
      - name: Mount gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }
          MOUNT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            %:  poke-our
                                %hood
                                %kiln-mount
                                !>([(en-beam [[our %gw-base [%da now]] /]) %gw-base])
                            ==
                          (pure:m !>(~))
                          '''
                      =="
          echo "Mounting gw-base desk..."
          RESULT=$(send_fyrd "$MOUNT_FYRD")
          sleep 5
          if [ -e "./zod/gw-base/sys.kelvin" ]; then
            echo "Desk mounted successfully."
            find ./zod/gw-base/ -type f | wc -l
            echo "files in gw-base"
          else
            echo "ERROR: Failed to mount desk - $RESULT"
          fi
      # -------------------------------------------------------
      # 11. Checkout gwbtc/urbit and copy pkg/arvo/* into gw-base
      # -------------------------------------------------------
      - name: Checkout gwbtc/urbit
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urbit
          ref: gw/next/kelvin/408
          path: gwbtc-urbit
          token: ${{ secrets.GH_PAT }}
      - name: Copy pkg/arvo into gw-base desk
        run: |
          echo "Copying gwbtc/urbit pkg/arvo/* into gw-base desk (overlaying on base)..."
          cp -rv gwbtc-urbit/pkg/arvo/* ./zod/gw-base/
          echo "Contents of gw-base after copy:"
          find ./zod/gw-base/ -type f | wc -l
          echo "total files"

      # -------------------------------------------------------
      # 11. Commit gw-base desk
      # -------------------------------------------------------
      - name: Commit gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' COMMIT_FYRD << 'HOON' || true
          :*  0
              %fyrd
              %base
              %khan-eval
              %noun
              %ted-eval
              :_  :~  /sur/spider/hoon
                      /lib/strandio/hoon
                  ==
              '''
              =/  m  (strand:spider ,vase)
              =>  |%
                  ++  print-tang-to-wain
                    |=  =tang
                    ^-  wain
                    %-  zing
                    %+  turn
                      tang
                    |=  =tank
                    %+  turn
                      (wash [0 80] tank)
                    |=  =tape
                    (crip tape)
                  --
              ^-  form:m
              ;<  ~  bind:m
                (send-raw-card [%pass /dill-logs %arvo %d %logs `~])
              ;<  ~  bind:m
                (poke-our %hood %kiln-commit !>([%gw-base %.n]))
              ;<  [wire =sign-arvo]  bind:m
                ((set-timeout ,[wire sign-arvo]) ~s10 take-sign-arvo)
              ?>  ?=([%dill %logs *] sign-arvo)
              ;<  ~  bind:m
                (send-raw-card [%pass /dill-logs %arvo %d %logs ~])
              =/  [%dill %logs =told:dill]  sign-arvo
              ?-  told
                [%crud *]
                (strand-fail:strand:spider %crud [p.told]~)
              ::
                [%talk *]
                (pure:m !>((crip "%talk: {<(print-tang-to-wain p.told)>}")))
              ::
                [%text *]
                (pure:m !>('Commit successful!'))
              ==
              '''
          ==
          HOON

          echo "Committing gw-base desk..."
          RESULT=$(send_fyrd "$COMMIT_FYRD")
          echo "Result: $RESULT"
          sleep 10

      # -------------------------------------------------------
      # 11a. Create %autoprop desk merged from base
      #      (base desk has lib/pill.hoon, lib/shoe.hoon, etc.)
      # -------------------------------------------------------
      - name: Create autoprop desk from base
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          CREATE_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            (send-raw-card %pass /merg %arvo %c %merg %autoprop [our %base da+now] %meet)
                          (pure:m !>('Created autoprop desk!'))
                          '''
                      =="

          echo "Creating autoprop desk from base..."
          RESULT=$(send_fyrd "$CREATE_FYRD")
          echo "Result: $RESULT"
          sleep 10

      # -------------------------------------------------------
      # 11b. Mount %autoprop desk
      # -------------------------------------------------------
      - name: Mount autoprop desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          MOUNT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            %:  poke-our
                                %hood
                                %kiln-mount
                                !>([(en-beam [[our %autoprop [%da now]] /]) %autoprop])
                            ==
                          (pure:m !>(~))
                          '''
                      =="

          echo "Mounting autoprop desk..."
          RESULT=$(send_fyrd "$MOUNT_FYRD")
          sleep 10
          if [ -d "./zod/autoprop" ]; then
            echo "Autoprop desk mounted."
            ls ./zod/autoprop/app/ 2>/dev/null || echo "(app/ not yet visible)"
          else
            echo "ERROR: autoprop desk not mounted."
            exit 1
          fi

      # -------------------------------------------------------
      # 11c. Overlay autoprop app file and commit
      # -------------------------------------------------------
      - name: Copy autoprop app into desk and commit
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          echo "Copying autoprop app files..."
          mkdir -p ./zod/autoprop/app
          cp gwbtc-urbit/pkg/autoprop/app/autoprop.hoon ./zod/autoprop/app/autoprop.hoon
          cp gwbtc-urbit/pkg/autoprop/desk.bill ./zod/autoprop/desk.bill
          echo "Files copied."

          COMMIT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  ~  bind:m
                            (poke-our %hood %kiln-commit !>([%autoprop %.n]))
                          (pure:m !>('Committed autoprop!'))
                          '''
                      =="

          echo "Committing autoprop desk..."
          RESULT=$(send_fyrd "$COMMIT_FYRD")
          echo "Result: $RESULT"
          sleep 15

      # -------------------------------------------------------
      # 12. Link autoprop and trigger solid pill build from gw-base
      # -------------------------------------------------------
      - name: Link autoprop and trigger pill build
        run: |
          echo "Linking autoprop agent via dojo..."
          tmux -S $TMUX_SOCK send-keys -t urbit-zod "|link %autoprop" Enter
          sleep 20

          echo "Configuring gw-base-pill build task (shoe interface)..."
          tmux -S $TMUX_SOCK send-keys -t urbit-zod "+gw-base-pill solid %gw-base" Enter
          sleep 5

          echo "Triggering build immediately..."
          tmux -S $TMUX_SOCK send-keys -t urbit-zod "!gw-base-pill" Enter
          echo "Pill build triggered."

      # -------------------------------------------------------
      # 13. Wait for pill to appear in .urb/put/autoprop/
      # -------------------------------------------------------
      - name: Wait for pill build output
        timeout-minutes: 30
        run: |
          echo "Polling for pill in ./zod/.urb/put/autoprop/..."
          for i in $(seq 1 60); do
            echo "--- Attempt $i of 60 ($((i * 30))s elapsed) ---"
            tail -1 ./urbit-boot.log 2>/dev/null || true

            PILL_FILE=$(find ./zod/.urb/put/autoprop/ -name "*.pill" -type f 2>/dev/null | head -1)
            if [ -n "$PILL_FILE" ]; then
              echo "Found pill at: $PILL_FILE"
              cp "$PILL_FILE" ./gw-base.pill
              ls -la ./gw-base.pill
              exit 0
            fi

            echo "No pill yet, waiting 30s..."
            sleep 30
          done

          echo "ERROR: Pill never appeared in .urb/put/autoprop/."
          echo "=== .urb/put/ contents ==="
          find ./zod/.urb/put/ -type f 2>/dev/null || echo "(empty or missing)"
          exit 1

      # -------------------------------------------------------
      # 14. Shutdown first fakeship
      # -------------------------------------------------------
      - name: Shutdown first fakeship
        run: |
          echo "Shutting down first fakeship..."
          if tmux -S $TMUX_SOCK has-session -t urbit-zod 2>/dev/null; then
            tmux -S $TMUX_SOCK send-keys -t urbit-zod "" Enter
            sleep 3
            tmux -S $TMUX_SOCK kill-session -t urbit-zod || true
            echo "Killed tmux session urbit-zod"
          fi
          pkill -f "urbit" || true
          sleep 5

      # -------------------------------------------------------
      # 15. Install Zig
      # -------------------------------------------------------
      - name: Install Zig
        run: |
          curl -LO https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xf zig-x86_64-linux-0.15.2.tar.xz
          sudo mv zig-x86_64-linux-0.15.2/zig /usr/local/bin/
          sudo mv zig-x86_64-linux-0.15.2/lib /usr/local/lib/zig
          zig version

      # -------------------------------------------------------
      # 16. Checkout gwbtc/urcrypt
      # -------------------------------------------------------
      - name: Checkout gwbtc/urcrypt
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urcrypt
          ref: gw/cmp-pub
          path: gwbtc-urcrypt
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Remove urcrypt zig build files
        run: |
          rm -f gwbtc-urcrypt/build.zig gwbtc-urcrypt/build.zig.zon
          echo "Removed build.zig and build.zig.zon from urcrypt"

      # -------------------------------------------------------
      # 17. Checkout gwbtc/vere
      # -------------------------------------------------------
      - name: Checkout gwbtc/vere
        uses: actions/checkout@v3
        with:
          repository: gwbtc/vere
          ref: gw/next/kelvin/408
          path: gwbtc-vere
          token: ${{ secrets.GH_PAT || github.token }}

      # -------------------------------------------------------
      # 18. Setup urcrypt as sibling to vere
      # -------------------------------------------------------
      - name: Setup urcrypt for vere build
        run: |
          ln -sf $(pwd)/gwbtc-urcrypt $(pwd)/gwbtc-vere/../urcrypt
          ls -la $(pwd)/gwbtc-vere/../urcrypt/

      # -------------------------------------------------------
      # 19. Build gwbtc/vere with zig build
      # -------------------------------------------------------
      - name: Build gwbtc/vere
        run: |
          cd gwbtc-vere
          echo "Building gwbtc/vere with zig build..."
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3..."
            if zig build; then
              echo "Build succeeded on attempt $attempt."
              break
            else
              if [ $attempt -eq 3 ]; then
                echo "All 3 attempts failed. Checking if zlib URL is the issue..."
                ZLIB_URL="https://github.com/allyourcodebase/zlib/archive/61e7df7e996ec5a5f13a653db3c419adb340d6ef.tar.gz"
                HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$ZLIB_URL")
                echo "zlib URL returned HTTP $HTTP_CODE"
                if [ "$HTTP_CODE" != "200" ]; then
                  echo "Patching build.zig.zon to use vendored zlib..."
                  mkdir -p ext/zlib-src
                  curl -L -o /tmp/zlib.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
                  tar xzf /tmp/zlib.tar.gz --strip-components=1 -C ext/zlib-src
                  python3 << 'PYEOF'
          import re
          with open('build.zig.zon', 'r') as f:
              content = f.read()
          content = re.sub(
              r'(\.zlib\s*=\s*\.\{)\s*\.url\s*=\s*"[^"]+",\s*\.hash\s*=\s*"[^"]+",',
              r'\1\n            .path = "./ext/zlib-src",',
              content
          )
          with open('build.zig.zon', 'w') as f:
              f.write(content)
          print('Patched build.zig.zon')
          PYEOF
                  zig build || { echo "Build failed even with vendored zlib."; exit 1; }
                else
                  echo "zlib URL is reachable but build still failed."
                  exit 1
                fi
              else
                echo "Build failed on attempt $attempt, retrying in 15s..."
                sleep 15
              fi
            fi
          done

          VERE_BIN=$(find zig-out -type f -executable 2>/dev/null | head -1)
          if [ -n "$VERE_BIN" ]; then
            cp "$VERE_BIN" ../gw-vere
          else
            echo "Binary not found in zig-out, searching..."
            find . -name "urbit" -o -name "vere" -type f 2>/dev/null | head -20
            exit 1
          fi
          cd ..
          chmod +x ./gw-vere
          echo "gwbtc/vere built successfully:"
          ls -la ./gw-vere
          ./gw-vere --version || true

      # -------------------------------------------------------
      # 20. Boot new fakeship with gw-base pill using gwbtc/vere
      # -------------------------------------------------------
      - name: Boot new fakeship with gw-base pill
        run: |
          tmux -S $TMUX_SOCK new-session -d -s urbit-zod2 -x 220 -y 50
          if [ -f ./gw-base.pill ]; then
            tmux -S $TMUX_SOCK send-keys -t urbit-zod2 "./gw-vere -t -F zod -B ./gw-base.pill -c zod2 2>&1 | tee ./urbit-zod2-boot.log" Enter
          else
            echo "WARNING: No pill found, booting with default pill."
            tmux -S $TMUX_SOCK send-keys -t urbit-zod2 "./gw-vere -t -F zod -c zod2 2>&1 | tee ./urbit-zod2-boot.log" Enter
          fi
          echo "Second fakeship booting in tmux session 'urbit-zod2'."

      - name: Fix zod2 pier permissions
        run: |
          sleep 5
          sudo chown -R $(whoami):$(whoami) ./zod2 || true
          echo "zod2 pier permissions fixed."

      # -------------------------------------------------------
      # 21. Wait for second fakeship to be idle
      # -------------------------------------------------------
      - name: Wait for second fakeship to be idle
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          FYRD=":*  0
                    %fyrd
                    %base
                    %khan-eval
                    %noun
                    %ted-eval
                    :_  ~
                    '''
                    =/  m  (strand ,vase)
                    (pure:m !>('Success!'))
                    '''
                =="

          echo "Polling second ship until idle..."
          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."
            tail -1 ./urbit-zod2-boot.log 2>/dev/null || true
            RESULT=$(echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true)
            echo "Result: $RESULT"
            if echo "$RESULT" | grep -q "%avow"; then
              echo "Second ship is idle and responsive after $((i * 10)) seconds."
              exit 0
            fi
            echo "Ship not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Second ship never became idle after 600 seconds."
          echo "=== Last 20 lines of zod2 boot log ==="
          tail -20 ./urbit-zod2-boot.log 2>/dev/null || true
          exit 1

      # -------------------------------------------------------
      # 22. Create %groundwire desk on new ship
      # -------------------------------------------------------
      - name: Create groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }

          NEW_DESK_FYRD=":*  0
                             %fyrd
                             %base
                             %khan-eval
                             %noun
                             %ted-eval
                             :_  :~  /sur/spider/hoon
                                     /lib/strandio/hoon
                                 ==
                             '''
                             =/  m  (strand ,vase)
                             ^-  form:m
                             ;<  =beak  bind:m  get-beak
                             ;<  ~  bind:m
                               %:  send-raw-card
                                   %pass   /make-new-desk
                                   %agent  [p.beak %hood]
                                   %poke   %helm-pass
                                   !>  ^-  note-arvo
                                   %^    new-desk:cloy
                                       %groundwire
                                     ~
                                   %-  ~(gas by *(map path page:clay))
                                   |^  =-  (turn - mage)
                                       ^-  (list path)
                                       =/  common-files=(list path)
                                         :~
                                           /mar/noun/hoon
                                           /mar/hoon/hoon
                                           /mar/txt/hoon
                                           /mar/kelvin/hoon
                                           /sys/kelvin
                                         ==
                                       =/  extra-files=(list path)
                                         :~
                                           /mar/bill/hoon
                                           /mar/mime/hoon
                                           /mar/json/hoon
                                           /lib/skeleton/hoon
                                           /lib/default-agent/hoon
                                           /lib/dbug/hoon
                                         ==
                                       (weld common-files extra-files)
                                   ::
                                   ++  mage
                                     |=  =path
                                     :-  path
                                     ^-  page:clay
                                     :-  (rear path)
                                     ~|  [%missing-source-file %base path]
                                     .^  *
                                       %cx
                                       (scot %p p.beak)
                                       %base
                                       (scot %da p.r.beak)
                                       path
                                     ==
                                   --
                               ==
                             (pure:m !>('Created desk!'))
                             '''
                         =="

          echo "Creating groundwire desk..."
          RESULT=$(send_fyrd "$NEW_DESK_FYRD")
          echo "Result: $RESULT"
          sleep 5

      # -------------------------------------------------------
      # 23. Mount %groundwire desk
      # -------------------------------------------------------
      - name: Mount groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }

          MOUNT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            %:  poke-our
                                %hood
                                %kiln-mount
                                !>([(en-beam [[our %groundwire [%da now]] /]) %groundwire])
                            ==
                          (pure:m !>(~))
                          '''
                      =="

          echo "Mounting groundwire desk..."
          RESULT=$(send_fyrd "$MOUNT_FYRD")
          sleep 5
          if [ -e "./zod2/groundwire/sys.kelvin" ]; then
            echo "Desk mounted successfully."
            cat ./zod2/groundwire/sys.kelvin
          else
            echo "ERROR: Failed to mount groundwire desk - $RESULT"
          fi

      # -------------------------------------------------------
      # 24. Checkout gwbtc/groundwire and build dependencies
      # -------------------------------------------------------
      - name: Checkout gwbtc/groundwire
        uses: actions/checkout@v3
        with:
          repository: gwbtc/groundwire
          ref: gw/next/kelvin/408
          path: gwbtc-groundwire
          token: ${{ secrets.GH_PAT }}

      - name: Build groundwire dependencies with peru
        run: |
          cd gwbtc-groundwire
          if [ -f build.sh ]; then
            chmod +x build.sh
            bash build.sh
            echo "Build script completed."
          else
            echo "WARNING: No build.sh found. Checking for peru.yaml..."
            if [ -f peru.yaml ]; then
              peru sync
            fi
          fi
          if [ -d dist ]; then
            echo "dist/ directory contents:"
            find dist/ -type f | head -50
            echo "..."
            find dist/ -type f | wc -l
            echo "total files in dist/"
          else
            echo "WARNING: No dist/ directory found after build."
          fi
          cd ..

      # -------------------------------------------------------
      # 25. Copy groundwire dist into mounted desk
      # -------------------------------------------------------
      - name: Copy groundwire dist into mounted desk
        run: |
          if [ -d gwbtc-groundwire/dist ]; then
            echo "Copying groundwire dist/* into mounted groundwire desk..."
            cp -rv gwbtc-groundwire/dist/* ./zod2/groundwire/
            echo "Contents of groundwire desk after copy:"
            find ./zod2/groundwire/ -type f | head -50
            echo "..."
            find ./zod2/groundwire/ -type f | wc -l
            echo "total files"
          else
            echo "ERROR: No dist/ directory to copy from."
            exit 1
          fi

      # -------------------------------------------------------
      # 26. Commit %groundwire desk
      # -------------------------------------------------------
      - name: Commit groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }

          COMMIT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  ~
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  ~  bind:m
                            (poke-our %hood %kiln-commit !>([%groundwire %.n]))
                          (pure:m !>('Commit successful!'))
                          '''
                      =="

          echo "Committing groundwire desk..."
          RESULT=$(send_fyrd "$COMMIT_FYRD")
          echo "Result: $RESULT"
          sleep 10

      # -------------------------------------------------------
      # 27. Install %groundwire desk
      # -------------------------------------------------------
      - name: Install groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }

          INSTALL_FYRD=":*  0
                            %fyrd
                            %base
                            %khan-eval
                            %noun
                            %ted-eval
                            :_  ~
                            '''
                            =/  m  (strand ,vase)
                            ^-  form:m
                            ;<  our=@p  bind:m  get-our
                            ;<  ~  bind:m
                              (poke-our %hood %kiln-install !>([%groundwire our %groundwire]))
                            (pure:m !>('Install successful!'))
                            '''
                        =="

          echo "Installing groundwire desk..."
          RESULT=$(send_fyrd "$INSTALL_FYRD")
          echo "Result: $RESULT"
          sleep 10

      # -------------------------------------------------------
      # 28. Validate groundwire desk
      # -------------------------------------------------------
      - name: Validate groundwire desk structure
        run: |
          echo "Validating groundwire desk contents..."
          ls -la ./zod2/groundwire/
          echo "Desk validation complete."

      # -------------------------------------------------------
      # 29. Build & Push Docker Image to DO Registry
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-groundwire:${{ github.sha }} .

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Push image to DigitalOcean Container Registry
        run: |
          docker push registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-groundwire:${{ github.sha }}

      # -------------------------------------------------------
      # 30. Deploy to DigitalOcean Kubernetes
      # -------------------------------------------------------
      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/urbit-groundwire \
            urbit-groundwire=registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-groundwire:${{ github.sha }}

      # -------------------------------------------------------
      # 31. Cleanup - shut down fakeships
      # -------------------------------------------------------
      - name: Shutdown fakeships
        if: always()
        run: |
          echo "Shutting down fakeships..."
          if tmux -S $TMUX_SOCK has-session -t urbit-zod2 2>/dev/null; then
            tmux -S $TMUX_SOCK send-keys -t urbit-zod2 "" Enter
            sleep 3
            tmux -S $TMUX_SOCK kill-session -t urbit-zod2 || true
            echo "Killed tmux session urbit-zod2"
          fi
          if tmux -S $TMUX_SOCK has-session -t urbit-zod 2>/dev/null; then
            tmux -S $TMUX_SOCK send-keys -t urbit-zod "" Enter
            sleep 3
            tmux -S $TMUX_SOCK kill-session -t urbit-zod || true
            echo "Killed tmux session urbit-zod"
          fi
          pkill -f "urbit" || true
          pkill -f "gw-vere" || true
          sudo rm -rf $TMUX_SOCK || true
          echo "Done."
