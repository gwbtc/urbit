name: Urbit Fakeship CI/CD - buildpill Desk
on:
  push:
    branches:
      - gw/next/kelvin/408
  pull_request:
    branches:
      - gw/next/kelvin/408
jobs:
  boot-fakeship-and-create-desk:
    runs-on: ubuntu-latest
    env:
      URBIT_SHIP: zod
      DESK_NAME: buildpill
      PIER: ./zod
      CONN_SOCK: ./zod/.urb/conn.sock
    steps:
      # -------------------------------------------------------
      # 1. Checkout Repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------------------------------------------
      # 2. Install DigitalOcean CLI (doctl)
      # -------------------------------------------------------
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # -------------------------------------------------------
      # 3. Install Urbit Binary
      # -------------------------------------------------------
      - name: Install Urbit binary
        run: |
          curl -JLO https://urbit.org/install/linux-x86_64/latest
          tar zxvf ./linux-x86_64.tgz
          sudo mv vere-v* /usr/local/bin/urbit
          urbit --version

      # -------------------------------------------------------
      # 4. Install netcat
      # -------------------------------------------------------
      - name: Install netcat
        run: |
          sudo apt-get install -y netcat-openbsd

      # -------------------------------------------------------
      # 5. Boot Urbit Fakeship (~zod)
      # -------------------------------------------------------
      - name: Boot fake ~zod ship
        run: |
          urbit -d -F zod -c zod
          echo "Fakeship boot initiated in daemon mode."

      - name: Debug conn.sock raw output
        run: |
          echo "=== Testing raw socket response ==="

          # First just check the socket is alive with the simplest possible fyrd
          FYRD="[0 %fyrd %base %khan-eval %noun %ted-eval '(add 1 1)']"

          echo "Sending: $FYRD"
          echo ""

          # Show raw bytes coming back before decode
          RAW=$(echo "$FYRD" | urbit eval -jn 2>&1 | xxd | head -5)
          echo "Jammed input (hex): $RAW"
          echo ""

          # Send and capture raw response as hex so we can see what we get back
          RESPONSE=$(echo "$FYRD" | urbit eval -jn 2>/dev/null | nc -U -W 1 ./zod/.urb/conn.sock 2>&1 | xxd | head -10)
          echo "Raw socket response (hex): $RESPONSE"
          echo ""

          # Now try to decode it
          DECODED=$(echo "$FYRD" | urbit eval -jn 2>/dev/null | nc -U -W 1 ./zod/.urb/conn.sock 2>/dev/null | urbit eval -cn 2>&1)
          echo "Decoded response: $DECODED"
      # -------------------------------------------------------
      # 6. Wait for fakeship to be fully idle
      # Replicates what click does:
      #   urbit eval -jn | nc -U -W 1 conn.sock | urbit eval -cn
      # We send a helm-hi poke to hood and wait for a success
      # response — this only works when the ship is truly idle
      # -------------------------------------------------------
      - name: Wait for fakeship to be idle
        run: |
          FYRD="[0 %fyrd %base %khan-eval %noun %ted-eval '(add 1 1)']"

          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."

            RESULT=$(echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 ./zod/.urb/conn.sock 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true)

            echo "Result: $RESULT"

            if echo "$RESULT" | grep -q "2"; then
              echo "Ship is idle after $((i * 10)) seconds."
              exit 0
            fi

            sleep 10
          done

      # -------------------------------------------------------
      # 7. Create new desk called 'buildpill'
      # -------------------------------------------------------
      - name: Create buildpill desk via dojo
        run: |
          # Helper function that replicates click behavior
          run_thread() {
            local HOON="$1"
            echo "$HOON" | urbit eval -jn 2>/dev/null | \
              nc -U -W 1 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null
          }

          # |new-desk %buildpill
          NEW_DESK_HOON=$'=/  m  (strand ,vase)  ;<  ~  bind:m  (poke [~zod %hood] %helm-hi !>(\\\'\\\'))  (pure:m !>(\\\'success\\\'))'

          echo "Creating buildpill desk..."
          run_thread "[0 %fyrd [%base %khan-eval %noun %ted-eval '[0 %fyrd [%base %new-desk %noun %noun %buildpill]]']]"
          sleep 5

          echo "Mounting buildpill desk..."
          run_thread "[0 %fyrd [%base %khan-eval %noun %ted-eval '[0 %fyrd [%base %mount %noun %noun %buildpill]]']]"
          sleep 5

          if [ -d "./zod/buildpill" ]; then
            echo "Desk 'buildpill' created and mounted successfully."
            ls -la ./zod/buildpill/
          else
            echo "ERROR: Desk 'buildpill' was not found after creation."
            exit 1
          fi

      # -------------------------------------------------------
      # 8. Validate buildpill desk structure
      # -------------------------------------------------------
      - name: Validate buildpill desk structure
        run: |
          echo "Validating buildpill desk contents..."
          ls -la ./zod/buildpill/
          echo "Desk validation complete."

      # -------------------------------------------------------
      # 9. Build & Push Docker Image to DO Registry
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-buildpill:${{ github.sha }} .

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Push image to DigitalOcean Container Registry
        run: |
          docker push registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-buildpill:${{ github.sha }}

      # -------------------------------------------------------
      # 10. Deploy to DigitalOcean Kubernetes
      # -------------------------------------------------------
      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/urbit-buildpill \
            urbit-buildpill=registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-buildpill:${{ github.sha }}

      # -------------------------------------------------------
      # 11. Cleanup - shut down fakeship
      # -------------------------------------------------------
      - name: Shutdown fakeship
        if: always()
        run: |
          echo "Shutting down fakeship..."
          URBIT_PID=$(cat ./zod/.urb/pid 2>/dev/null || true)
          if [ -n "$URBIT_PID" ]; then
            kill $URBIT_PID || true
            echo "Killed fakeship PID $URBIT_PID"
          else
            echo "No PID file found, trying pkill..."
            pkill -f "urbit" || true
          fi
          echo "Done."
