name: Urbit Fakeship CI/CD - buildpill Desk

on:
  push:
    branches:
      - gw/next/kelvin/408
  pull_request:
    branches:
      - gw/next/kelvin/408

jobs:
  boot-fakeship-and-create-desk:
    runs-on: ubuntu-latest

    env:
      URBIT_SHIP: zod
      DESK_NAME: buildpill

    steps:
      # -------------------------------------------------------
      # 1. Checkout Repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------------------------------------------
      # 2. Install DigitalOcean CLI (doctl)
      # -------------------------------------------------------
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # -------------------------------------------------------
      # 3. Install Urbit Binary
      # -------------------------------------------------------
      - name: Install Urbit binary
        run: |
          curl -JLO https://urbit.org/install/linux-x86_64/latest
          tar zxvf ./linux-x86_64.tgz
          sudo mv vere-v* /usr/local/bin/urbit
          urbit --version

      # -------------------------------------------------------
      # 4. Boot Urbit Fakeship (~zod)
      # Fake ships do not require an Azimuth identity [1]
      # -------------------------------------------------------
      - name: Boot fake ~zod ship
        run: |
          urbit -d -F zod -c zod

          echo "Waiting for fakeship to boot..."

          # Poll for the socket instead of a fixed sleep
          for i in $(seq 1 30); do
            if [ -S "./zod/.urb/conn.sock" ]; then
              echo "Ship is up after $((i * 10)) seconds."
              break
            fi
            echo "Waiting... ($((i * 10))s elapsed)"
            sleep 10
          done

          if [ ! -S "./zod/.urb/conn.sock" ]; then
            echo "ERROR: Ship failed to boot after 300 seconds."
            exit 1
          fi

      # -------------------------------------------------------
      # 5. Create new desk called 'buildpill'
      # Uses urbit-king (|new-desk CLI approach) [1]
      # -------------------------------------------------------
      - name: Create buildpill desk via dojo
        run: |
          # Install nmap which includes ncat
          sudo apt-get install -y nmap

          echo "Creating desk: $DESK_NAME"

          # Verify the socket exists before trying to connect
          echo "Checking for conn.sock..."
          ls -la ./zod/.urb/

          if [ ! -S "./zod/.urb/conn.sock" ]; then
            echo "ERROR: conn.sock not found, ship may not be fully booted."
            exit 1
          fi

          echo "Socket found, sending commands..."

          echo "|new-desk %buildpill" | ncat -U ./zod/.urb/conn.sock
          sleep 10

          echo "|mount %buildpill" | ncat -U ./zod/.urb/conn.sock
          sleep 10

          if [ -d "./zod/buildpill" ]; then
            echo "Desk 'buildpill' created and mounted successfully."
          else
            echo "ERROR: Desk 'buildpill' was not found after creation."
            exit 1
          fi

      # -------------------------------------------------------
      # 6. Run any desk-level tests or validations
      # -------------------------------------------------------
      - name: Validate buildpill desk structure
        run: |
          echo "Validating buildpill desk contents..."
          ls -la ./zod/buildpill/
          echo "Desk validation complete."

      # -------------------------------------------------------
      # 7. (Optional) Build & Push Docker Image to DO Registry
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-buildpill:${{ github.sha }} .

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Push image to DigitalOcean Container Registry
        run: |
          docker push registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-buildpill:${{ github.sha }}

      # -------------------------------------------------------
      # 8. (Optional) Deploy to DigitalOcean Kubernetes
      # -------------------------------------------------------
      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/urbit-buildpill \
            urbit-buildpill=registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-buildpill:${{ github.sha }}

      # -------------------------------------------------------
      # 9. Cleanup - shut down fakeship
      # -------------------------------------------------------
      - name: Shutdown fakeship
        if: always()
        run: |
          echo "Shutting down fakeship..."
          kill $URBIT_PID || true
          echo "Done."
