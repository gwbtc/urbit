name: Build Groundwire
on:
  push:
    branches:
      - gw/next/kelvin/408
  pull_request:
    branches:
      - gw/next/kelvin/408

jobs:
  # =============================================================
  # Job 1: Build the brass pill (runs once on ubuntu)
  # =============================================================
  build-pill:
    runs-on: ubuntu-latest
    env:
      CONN_SOCK: ./zod/.urb/conn.sock
    steps:
      - name: Clean up leftover piers
        run: sudo rm -rf ./zod || true

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Urbit binary
        run: |
          curl -JLO https://urbit.org/install/linux-x86_64/latest
          tar zxvf ./linux-x86_64.tgz
          sudo mv vere-v* /usr/local/bin/urbit
          urbit --version

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd

      - name: Install peru
        run: |
          sudo apt-get install -y pipx
          pipx ensurepath
          pipx install peru
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Boot fake ~zod ship
        run: |
          urbit -d -F zod -c zod
          echo "Fakeship boot initiated in daemon mode."

      - name: Wait for fakeship to be idle
        run: |
          FYRD=":*  0
                    %fyrd
                    %base
                    %khan-eval
                    %noun
                    %ted-eval
                    :_  ~
                    '''
                    =/  m  (strand ,vase)
                    (pure:m !>('Success!'))
                    '''
                =="

          echo "Polling ship until idle..."
          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."
            RESULT=$(echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true)
            echo "Result: $RESULT"
            if echo "$RESULT" | grep -q "%avow"; then
              echo "Ship is idle and responsive after $((i * 10)) seconds."
              exit 0
            fi
            echo "Ship not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Ship never became idle after 600 seconds."
          exit 1

      - name: Mount base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }
          MOUNT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            %:  poke-our
                                %hood
                                %kiln-mount
                                !>([(en-beam [[our %base [%da now]] /]) %base])
                            ==
                          (pure:m !>(~))
                          '''
                      =="
          echo "Mounting base desk..."
          RESULT=$(send_fyrd "$MOUNT_FYRD")
          sleep 5
          if [ -d "./zod/base" ]; then
            echo "Base desk mounted successfully."
          else
            echo "ERROR: Failed to mount base desk"
            exit 1
          fi

      - name: Create gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' MERGE_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)  ^-  form:m
              ;<  our=@p  bind:m  get-our
              ;<  now=@da  bind:m  get-time
              ;<  ~  bind:m
                (poke-our %hood %kiln-merge !>([%gw-base our %base [%da now] %init]))
              (pure:m !>('Merge sent!'))
              '''
          ==
          HOON

          echo "Creating gw-base desk via merge..."
          RESULT=$(send_fyrd "$MERGE_FYRD")
          echo "Result: $RESULT"

      - name: Mount gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' MOUNT_GW_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)  ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              ;<  ~  bind:m
                %:  poke-our  %hood  %kiln-mount
                    !>([(en-beam [[our %gw-base [%da now]] /]) %gw-base])  ==
              (pure:m !>(~))
              '''
          ==
          HOON

          echo "Polling to mount gw-base (up to 3 min for merge to complete)..."
          for i in $(seq 1 18); do
            RESULT=$(send_fyrd "$MOUNT_GW_FYRD")
            sleep 5
            if [ -e "./zod/gw-base/sys.kelvin" ]; then
              echo "gw-base mounted successfully (attempt $i)."
              break
            fi
            if [ $i -eq 18 ]; then
              echo "ERROR: gw-base never mounted after 18 attempts"
              exit 1
            fi
            echo "  attempt $i: not yet, waiting 10s..."
            sleep 10
          done

      - name: Checkout gwbtc/urbit
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urbit
          ref: gw/next/kelvin/408
          path: gwbtc-urbit
          token: ${{ secrets.GH_PAT }}

      - name: Copy pkg/arvo into gw-base desk
        run: |
          echo "Copying gwbtc/urbit pkg/arvo changes into gw-base desk..."
          rsync -av --no-links --checksum \
            --exclude='.git*' --exclude='.ignore' \
            gwbtc-urbit/pkg/arvo/ ./zod/gw-base/
          echo "Done."

      - name: Checkout gwbtc/groundwire
        uses: actions/checkout@v3
        with:
          repository: gwbtc/groundwire
          ref: hd/consolidate-urb
          path: gwbtc-groundwire
          token: ${{ secrets.GH_PAT }}

      - name: Build groundwire dependencies with peru
        run: |
          cd gwbtc-groundwire
          if [ -f build.sh ]; then
            chmod +x build.sh
            bash build.sh
            echo "Build script completed."
          else
            echo "WARNING: No build.sh found. Checking for peru.yaml..."
            if [ -f peru.yaml ]; then
              peru sync
            fi
          fi
          if [ -d dist ]; then
            echo "dist/ directory contents:"
            find dist/ -type f | head -50
            echo "..."
            find dist/ -type f | wc -l
            echo "total files in dist/"
          else
            echo "WARNING: No dist/ directory found after build."
          fi
          cd ..

      - name: Create groundwire desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' MERGE_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)  ^-  form:m
              ;<  our=@p  bind:m  get-our
              ;<  now=@da  bind:m  get-time
              ;<  ~  bind:m
                (poke-our %hood %kiln-merge !>([%groundwire our %base [%da now] %init]))
              (pure:m !>('Merge sent!'))
              '''
          ==
          HOON

          echo "Creating groundwire desk via merge..."
          RESULT=$(send_fyrd "$MERGE_FYRD")
          echo "Result: $RESULT"

      - name: Mount groundwire desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' MOUNT_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)  ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              ;<  ~  bind:m
                %:  poke-our  %hood  %kiln-mount
                    !>([(en-beam [[our %groundwire [%da now]] /]) %groundwire])  ==
              (pure:m !>(~))
              '''
          ==
          HOON

          echo "Polling to mount groundwire (up to 3 min for merge to complete)..."
          for i in $(seq 1 18); do
            RESULT=$(send_fyrd "$MOUNT_FYRD")
            sleep 5
            if [ -e "./zod/groundwire/sys.kelvin" ]; then
              echo "groundwire mounted successfully (attempt $i)."
              break
            fi
            if [ $i -eq 18 ]; then
              echo "ERROR: groundwire never mounted after 18 attempts"
              exit 1
            fi
            echo "  attempt $i: not yet, waiting 10s..."
            sleep 10
          done

      - name: Copy groundwire dist into mounted desk
        run: |
          if [ -d gwbtc-groundwire/dist ]; then
            echo "Copying groundwire dist/* into mounted groundwire desk..."
            cp -rv gwbtc-groundwire/dist/* ./zod/groundwire/
            echo "Done."
          else
            echo "ERROR: No dist/ directory to copy from."
            exit 1
          fi

      - name: Validate desk structure
        run: |
          echo "gw-base:"
          ls ./zod/gw-base/ | head -10
          echo "groundwire:"
          ls ./zod/groundwire/ | head -10

      - name: Trigger brass pill build
        run: |
          read -r -d '' BUILD_PILL_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  /lib/pill/hoon  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              =/  sys=path    /(scot %p our)/gw-base/(scot %da now)/sys
              =/  =pill:pill  (brass:pill sys ~ & | | ~)
              ;<  ~  bind:m
                %:  send-raw-card
                    %pass  /build
                    %arvo  %c
                    %info  %gw-base  %&
                    :~  [/pill/pill %ins %pill !>(pill)]
                    ==
                ==
              (pure:m !>('Built pill!'))
              '''
          ==
          HOON

          echo "Triggering brass pill build (fire-and-forget, build may take up to 15 min)..."
          echo "$BUILD_PILL_FYRD" | urbit eval -jn 2>/dev/null | \
            nc -U -W 1 $CONN_SOCK 2>/dev/null > /dev/null &
          echo "Pill build triggered."

      - name: Wait for pill build output
        timeout-minutes: 30
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }

          read -r -d '' COMMIT_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  ~  bind:m
                (poke-our %hood %kiln-commit !>([%gw-base %.n]))
              (pure:m !>('Commit sent!'))
              '''
          ==
          HOON

          echo "Polling for pill in ./zod/gw-base/ (up to 30 min)..."
          for i in $(seq 1 600); do
            send_fyrd "$COMMIT_FYRD" > /dev/null 2>&1 || true
            PILL_FILE=$(find ./zod/gw-base/ -name "*.pill" -type f 2>/dev/null | head -1)
            if [ -n "$PILL_FILE" ]; then
              echo "Found pill at: $PILL_FILE"
              cp "$PILL_FILE" ./gw-base.pill
              ls -la ./gw-base.pill
              exit 0
            fi
            if [ $((i % 60)) -eq 0 ]; then
              echo "--- $i iterations elapsed, no pill yet ---"
            fi
          done
          echo "ERROR: Pill never appeared in ./zod/gw-base/."
          find ./zod/gw-base/ -type f 2>/dev/null | head -20 || echo "(empty)"
          exit 1

      - name: Shutdown fakeship
        if: always()
        run: |
          URBIT_PID=$(cat ./zod/.urb/pid 2>/dev/null || true)
          if [ -n "$URBIT_PID" ]; then
            kill "$URBIT_PID" || true
          fi
          sleep 3
          pkill -f "urbit" || true

      - name: Upload pill artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw-base-pill
          path: ./gw-base.pill

  # =============================================================
  # Job 2: Build vere for each target (4 parallel jobs)
  # =============================================================
  build-vere:
    strategy:
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            zig_archive: zig-x86_64-linux-0.15.2.tar.xz
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            zig_archive: zig-aarch64-linux-0.15.2.tar.xz
          - target: macos-x86_64
            runner: macos-13
            zig_archive: zig-x86_64-macos-0.15.2.tar.xz
          - target: macos-aarch64
            runner: macos-latest
            zig_archive: zig-aarch64-macos-0.15.2.tar.xz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install Zig
        run: |
          curl -LO "https://ziglang.org/download/0.15.2/${{ matrix.zig_archive }}"
          tar xf "${{ matrix.zig_archive }}"
          ZIG_DIR="${{ matrix.zig_archive }}"
          ZIG_DIR="${ZIG_DIR%.tar.xz}"
          echo "$(pwd)/$ZIG_DIR" >> $GITHUB_PATH

      - name: Verify Zig
        run: zig version

      - name: Checkout gwbtc/urcrypt
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urcrypt
          ref: gw/cmp-pub
          path: gwbtc-urcrypt
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Remove urcrypt zig build files
        run: rm -f gwbtc-urcrypt/build.zig gwbtc-urcrypt/build.zig.zon

      - name: Checkout gwbtc/vere
        uses: actions/checkout@v3
        with:
          repository: gwbtc/vere
          ref: gw/next/kelvin/408
          path: gwbtc-vere
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup urcrypt for vere build
        run: |
          ln -sf $(pwd)/gwbtc-urcrypt $(pwd)/gwbtc-vere/../urcrypt
          ls -la $(pwd)/gwbtc-vere/../urcrypt/

      - name: Build gwbtc/vere
        run: |
          cd gwbtc-vere
          echo "Building gwbtc/vere for ${{ matrix.target }}..."
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3..."
            if zig build; then
              echo "Build succeeded on attempt $attempt."
              break
            else
              if [ $attempt -eq 3 ]; then
                echo "All 3 attempts failed. Checking if zlib URL is the issue..."
                ZLIB_URL="https://github.com/allyourcodebase/zlib/archive/61e7df7e996ec5a5f13a653db3c419adb340d6ef.tar.gz"
                HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$ZLIB_URL")
                echo "zlib URL returned HTTP $HTTP_CODE"
                if [ "$HTTP_CODE" != "200" ]; then
                  echo "Patching build.zig.zon to use vendored zlib..."
                  mkdir -p ext/zlib-src
                  curl -L -o /tmp/zlib.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
                  tar xzf /tmp/zlib.tar.gz --strip-components=1 -C ext/zlib-src
                  python3 << 'PYEOF'
          import re
          with open('build.zig.zon', 'r') as f:
              content = f.read()
          content = re.sub(
              r'(\.zlib\s*=\s*\.\{)\s*\.url\s*=\s*"[^"]+",\s*\.hash\s*=\s*"[^"]+",',
              r'\1\n            .path = "./ext/zlib-src",',
              content
          )
          with open('build.zig.zon', 'w') as f:
              f.write(content)
          print('Patched build.zig.zon')
          PYEOF
                  zig build || { echo "Build failed even with vendored zlib."; exit 1; }
                else
                  echo "zlib URL is reachable but build still failed."
                  exit 1
                fi
              else
                echo "Build failed on attempt $attempt, retrying in 15s..."
                sleep 15
              fi
            fi
          done

          VERE_BIN=$(find zig-out -type f -executable 2>/dev/null | head -1)
          if [ -z "$VERE_BIN" ]; then
            # macOS: executables may not have +x in find results
            VERE_BIN=$(find zig-out -type f -name "urbit" -o -type f -name "vere" 2>/dev/null | head -1)
          fi
          if [ -n "$VERE_BIN" ]; then
            cp "$VERE_BIN" ../gw-vere
          else
            echo "ERROR: Binary not found in zig-out"
            find zig-out/ -type f 2>/dev/null | head -20
            exit 1
          fi
          cd ..
          chmod +x ./gw-vere
          echo "gwbtc/vere built successfully for ${{ matrix.target }}:"
          ls -la ./gw-vere
          ./gw-vere --version || true

      - name: Upload vere artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw-vere-${{ matrix.target }}
          path: ./gw-vere

  # =============================================================
  # Job 3: Validate pill + vere, then publish release
  # =============================================================
  validate-and-release:
    needs: [build-pill, build-vere]
    runs-on: ubuntu-latest
    steps:
      - name: Download pill
        uses: actions/download-artifact@v4
        with:
          name: gw-base-pill
          path: ./artifacts/pill

      - name: Download all vere binaries
        uses: actions/download-artifact@v4
        with:
          pattern: gw-vere-*
          path: ./artifacts/vere

      - name: Prepare artifacts
        run: |
          cp ./artifacts/pill/gw-base.pill ./gw-base.pill
          ls -la ./gw-base.pill
          echo "Vere binaries:"
          find ./artifacts/vere/ -type f -ls

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd

      - name: Validate pill by booting with linux-x86_64 vere
        run: |
          cp ./artifacts/vere/gw-vere-linux-x86_64/gw-vere ./gw-vere
          chmod +x ./gw-vere
          ./gw-vere -d -F zod -B ./gw-base.pill -c zod2

          CONN_SOCK=./zod2/.urb/conn.sock
          FYRD=":*  0
                    %fyrd
                    %base
                    %khan-eval
                    %noun
                    %ted-eval
                    :_  ~
                    '''
                    =/  m  (strand ,vase)
                    (pure:m !>('Success!'))
                    '''
                =="

          echo "Polling ship until idle..."
          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."
            RESULT=$(echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true)
            echo "Result: $RESULT"
            if echo "$RESULT" | grep -q "%avow"; then
              echo "Ship is idle and responsive after $((i * 10)) seconds."
              break
            fi
            if [ $i -eq 60 ]; then
              echo "ERROR: Ship never became idle after 600 seconds."
              exit 1
            fi
            echo "Ship not ready yet, waiting 10s..."
            sleep 10
          done

          echo "Validation successful. Ship booted with pill + vere."
          ls -la ./zod2/

      - name: Shutdown validation ship
        if: always()
        run: |
          ZOD2_PID=$(cat ./zod2/.urb/pid 2>/dev/null || true)
          if [ -n "$ZOD2_PID" ]; then
            kill "$ZOD2_PID" || true
          fi
          sleep 3
          pkill -f "gw-vere" || true

      - name: Install gh CLI
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh
          fi
          gh --version

      - name: Publish release artifacts
        run: |
          for target in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            mkdir -p "pkg-${target}"
            cp ./gw-base.pill "pkg-${target}/"
            cp "./artifacts/vere/gw-vere-${target}/gw-vere" "pkg-${target}/gw-vere"
            chmod +x "pkg-${target}/gw-vere"
            tar czf "groundwire-${target}.tar.gz" -C "pkg-${target}" .
          done

          gh release create "build-${GITHUB_SHA:0:8}" \
            groundwire-linux-x86_64.tar.gz \
            groundwire-linux-aarch64.tar.gz \
            groundwire-macos-x86_64.tar.gz \
            groundwire-macos-aarch64.tar.gz \
            --repo gwbtc/urbit \
            --title "Build ${GITHUB_SHA:0:8}" \
            --notes "Automated build from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA})

          Each tarball contains \`gw-base.pill\` and \`gw-vere\` for the target platform.
          - \`groundwire-linux-x86_64.tar.gz\`
          - \`groundwire-linux-aarch64.tar.gz\`
          - \`groundwire-macos-x86_64.tar.gz\`
          - \`groundwire-macos-aarch64.tar.gz\`"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
