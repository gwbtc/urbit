name: Urbit Fakeship CI/CD - Groundwire
on:
  push:
    branches:
      - gw/next/kelvin/408
  pull_request:
    branches:
      - gw/next/kelvin/408
jobs:
  boot-fakeship-and-create-desk:
    runs-on: ubuntu-latest
    env:
      URBIT_SHIP: zod
      DESK_NAME: gw-base
      PIER: ./zod
      CONN_SOCK: ./zod/.urb/conn.sock
    steps:
      # -------------------------------------------------------
      # 1. Checkout Repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3
      # -------------------------------------------------------
      # 2. Install DigitalOcean CLI (doctl)
      # -------------------------------------------------------
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      # -------------------------------------------------------
      # 3. Install Urbit Binary
      # -------------------------------------------------------
      - name: Install Urbit binary
        run: |
          curl -JLO https://urbit.org/install/linux-x86_64/latest
          tar zxvf ./linux-x86_64.tgz
          sudo mv vere-v* /usr/local/bin/urbit
          urbit --version
      # -------------------------------------------------------
      # 4. Install netcat
      # -------------------------------------------------------
      - name: Install netcat
        run: |
          sudo apt-get install -y netcat-openbsd
      # -------------------------------------------------------
      # 5. Install peru (for groundwire dependency management)
      # -------------------------------------------------------
      - name: Install peru
        run: |
          pip3 install peru
      # -------------------------------------------------------
      # 6. Boot Urbit Fakeship (~zod)
      # -------------------------------------------------------
      - name: Boot fake ~zod ship
        run: |
          urbit -d -F zod -c zod
          echo "Fakeship boot initiated in daemon mode."
      # -------------------------------------------------------
      # 7. Wait for fakeship to be fully idle
      # -------------------------------------------------------
      - name: Wait for fakeship to be idle
        run: |
          FYRD=":*  0
                    %fyrd
                    %base
                    %khan-eval
                    %noun
                    %ted-eval
                    :_  ~
                    '''
                    =/  m  (strand ,vase)
                    (pure:m !>('Success!'))
                    '''
                =="
          echo "Polling ship until idle..."
          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."
            RESULT=$(echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true)
            echo "Result: $RESULT"
            if echo "$RESULT" | grep -q "%avow"; then
              echo "Ship is idle and responsive after $((i * 10)) seconds."
              exit 0
            fi
            echo "Ship not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Ship never became idle after 600 seconds."
          exit 1
      # -------------------------------------------------------
      # 8. Create new desk called 'gw-base'
      # -------------------------------------------------------
      - name: Create gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }
          NEW_DESK_FYRD=":*  0
                             %fyrd
                             %base
                             %khan-eval
                             %noun
                             %ted-eval
                             :_  :~  /sur/spider/hoon
                                     /lib/strandio/hoon
                                 ==
                             '''
                             =/  m  (strand ,vase)
                             ^-  form:m
                             ;<  =beak  bind:m  get-beak
                             ;<  ~  bind:m
                               %:  send-raw-card
                                   %pass   /make-new-desk
                                   %agent  [p.beak %hood]
                                   %poke   %helm-pass
                                   !>  ^-  note-arvo
                                   %^    new-desk:cloy
                                       %gw-base
                                     ~
                                   %-  ~(gas by *(map path page:clay))
                                   |^  =-  (turn - mage)
                                       ^-  (list path)
                                       =/  common-files=(list path)
                                         :~
                                           /mar/noun/hoon
                                           /mar/hoon/hoon
                                           /mar/txt/hoon
                                           /mar/kelvin/hoon
                                           /sys/kelvin
                                         ==
                                       =/  extra-files=(list path)
                                         :~
                                           /mar/bill/hoon
                                           /mar/mime/hoon
                                           /mar/json/hoon
                                           /lib/skeleton/hoon
                                           /lib/default-agent/hoon
                                           /lib/dbug/hoon
                                         ==
                                       (weld common-files extra-files)
                                   ::
                                   ++  mage
                                     |=  =path
                                     :-  path
                                     ^-  page:clay
                                     :-  (rear path)
                                     ~|  [%missing-source-file %base path]
                                     .^  *
                                       %cx
                                       (scot %p p.beak)
                                       %base
                                       (scot %da p.r.beak)
                                       path
                                     ==
                                   --
                               ==
                             (pure:m !>('Created desk!'))
                             '''
                         =="
          echo "Creating gw-base desk..."
          RESULT=$(send_fyrd "$NEW_DESK_FYRD")
          echo "Result: $RESULT"
          sleep 5
      # -------------------------------------------------------
      # 9. Mount gw-base desk
      # -------------------------------------------------------
      - name: Mount gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }
          MOUNT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            %:  poke-our
                                %hood
                                %kiln-mount
                                !>([(en-beam [[our %gw-base [%da now]] /]) %gw-base])
                            ==
                          (pure:m !>(~))
                          '''
                      =="
          echo "Mounting gw-base desk..."
          RESULT=$(send_fyrd "$MOUNT_FYRD")
          sleep 5
          if [ -e "./zod/gw-base/sys.kelvin" ]; then
            echo "Desk mounted successfully."
            cat ./zod/gw-base/sys.kelvin
          else
            echo "ERROR: Failed to mount desk - $RESULT"
          fi
      # -------------------------------------------------------
      # 10. Checkout gwbtc/urbit and copy pkg/arvo/* into gw-base
      # -------------------------------------------------------
      - name: Checkout gwbtc/urbit
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urbit
          ref: gw/next/kelvin/408
          path: gwbtc-urbit
          token: ${{ secrets.GH_PAT }}
      - name: Copy pkg/arvo into gw-base desk
        run: |
          echo "Copying gwbtc/urbit pkg/arvo/* into gw-base desk..."
          cp -rv gwbtc-urbit/pkg/arvo/* ./zod/gw-base/
          echo "Contents of gw-base after copy:"
          find ./zod/gw-base/ -type f | head -50
          echo "..."
          find ./zod/gw-base/ -type f | wc -l
          echo "total files"
      # -------------------------------------------------------
      # 11. Commit gw-base desk
      # -------------------------------------------------------
      - name: Commit gw-base desk
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }
          read -r -d '' COMMIT_FYRD << 'HOON' || true
          :*  0
              %fyrd
              %base
              %khan-eval
              %noun
              %ted-eval
              :_  :~  /sur/spider/hoon
                      /lib/strandio/hoon
                  ==
              '''
              =/  m  (strand:spider ,vase)
              ^-  form:m
              ;<  ~  bind:m
                (send-raw-card [%pass /dill-logs %arvo %d %logs `~])
              ;<  ~  bind:m
                (poke-our %hood %kiln-commit !>([%gw-base %.n]))
              ;<  [wire =sign-arvo]  bind:m
                ((set-timeout ,[wire sign-arvo]) ~s10 take-sign-arvo)
              ?>  ?=([%dill %logs *] sign-arvo)
              ;<  ~  bind:m
                (send-raw-card [%pass /dill-logs %arvo %d %logs ~])
              =/  [%dill %logs =told:dill]  sign-arvo
              ?-  told
                [%crud *]
                (strand-fail:strand:spider %crud ~)
              ::
                [%talk *]
                (pure:m !>(~))
              ::
                [%text *]
                (pure:m !>('Commit successful!'))
              ==
              '''
          ==
          HOON
          echo "Committing gw-base desk..."
          RESULT=$(send_fyrd "$COMMIT_FYRD")
          echo "Result: $RESULT"
          sleep 10
      # -------------------------------------------------------
      # 12. Build brass pill from gw-base
      # -------------------------------------------------------
      - name: Build brass pill
        run: |
          BUILD_PILL_FYRD=":*  0
                            %fyrd
                            %base
                            %khan-eval
                            %noun
                            %ted-eval
                            :_  :~  /sur/spider/hoon
                                    /lib/strandio/hoon
                                    /lib/pill/hoon
                                ==
                            '''
                            =/  m  (strand ,vase)
                            ^-  form:m
                            ;<  our=@p   bind:m  get-our
                            ;<  now=@da  bind:m  get-time
                            =/  sys=path    /(scot %p our)/gw-base/(scot %da now)/sys
                            =/  =pill:pill  (brass:pill sys ~ & | | ~)
                            ;<  ~  bind:m
                              %:  send-raw-card
                                  %pass  /build
                                  %arvo  %c
                                  %info  %gw-base  %&
                                  :~  [/pill/pill %ins %pill !>(pill)]
                                  ==
                              ==
                            (pure:m !>('Built pill!'))
                            '''
                        =="
          echo "Sending pill build command..."
          echo "$BUILD_PILL_FYRD" | urbit eval -jn 2>/dev/null | \
            nc -U -W 1 $CONN_SOCK 2>/dev/null > /dev/null &
          echo "Pill build fyrd sent (running in background)."
          echo "This will take several minutes to complete."
      # -------------------------------------------------------
      # 13. Wait for pill build and extract
      # -------------------------------------------------------
      - name: Wait for pill build and extract
        timeout-minutes: 15
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | urbit eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              urbit eval -cn 2>/dev/null || true
          }
          IDLE_FYRD=":*  0
                        %fyrd
                        %base
                        %khan-eval
                        %noun
                        %ted-eval
                        :_  ~
                        '''
                        =/  m  (strand ,vase)
                        (pure:m !>('alive'))
                        '''
                    =="
          COMMIT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  ~
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  ~  bind:m
                            (poke-our %hood %kiln-commit !>([%gw-base %.n]))
                          (pure:m !>('Commit successful!'))
                          '''
                      =="
          echo "Polling for pill file in gw-base desk (may take 20 minutes)..."
          for i in $(seq 1 600); do
            echo "--- Attempt $i of 600 ($((i * 10))s elapsed) ---"
            # Check if ship is still alive
            ALIVE=$(send_fyrd "$IDLE_FYRD")
            if echo "$ALIVE" | grep -q "%avow"; then
              echo "Ship is responsive."
            else
              echo "Ship not responding, it may be busy building the pill..."
            fi
            # Trigger commit to sync clay to unix
            send_fyrd "$COMMIT_FYRD" > /dev/null 2>&1
            # Check for pill
            echo "Searching for pill files:"
            find ./zod/gw-base/ -name "*.pill" -type f 2>/dev/null
            PILL_FILE=$(find ./zod/gw-base/ -name "*.pill" -type f 2>/dev/null | head -1)
            if [ -n "$PILL_FILE" ]; then
              echo "Found pill at: $PILL_FILE"
              cp "$PILL_FILE" ./gw-base.pill
              ls -la ./gw-base.pill
              exit 0
            fi
            sleep 30
          done
          echo "ERROR: Pill was never written after 6000 seconds."
          echo "All files in gw-base:"
          find ./zod/gw-base/ -type f
          echo "Checking ship status:"
          cat ./zod/.urb/pid 2>/dev/null && echo "Ship PID exists" || echo "No PID file"
          exit 1
      # -------------------------------------------------------
      # 14. Shutdown first fakeship
      # -------------------------------------------------------
      - name: Shutdown first fakeship
        run: |
          echo "Shutting down first fakeship..."
          URBIT_PID=$(cat ./zod/.urb/pid 2>/dev/null || true)
          if [ -n "$URBIT_PID" ]; then
            kill $URBIT_PID || true
            echo "Killed fakeship PID $URBIT_PID"
            sleep 5
          else
            pkill -f "urbit" || true
            sleep 5
          fi
      # -------------------------------------------------------
      # 15. Install Zig
      # -------------------------------------------------------
      - name: Install Zig
        run: |
          curl -LO https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xf zig-x86_64-linux-0.15.2.tar.xz
          sudo mv zig-x86_64-linux-0.15.2/zig /usr/local/bin/
          sudo mv zig-x86_64-linux-0.15.2/lib /usr/local/lib/zig
          zig version
      # -------------------------------------------------------
      # 16. Checkout gwbtc/urcrypt
      # -------------------------------------------------------
      - name: Checkout gwbtc/urcrypt
        uses: actions/checkout@v3
        with:
          repository: gwbtc/urcrypt
          ref: gw/cmp-pub
          path: gwbtc-urcrypt
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Remove urcrypt zig build files
        run: |
          rm -f gwbtc-urcrypt/build.zig gwbtc-urcrypt/build.zig.zon
          echo "Removed build.zig and build.zig.zon from urcrypt"
      # -------------------------------------------------------
      # 17. Checkout gwbtc/vere
      # -------------------------------------------------------
      - name: Checkout gwbtc/vere
        uses: actions/checkout@v3
        with:
          repository: gwbtc/vere
          ref: gw/next/kelvin/408
          path: gwbtc-vere
          token: ${{ secrets.GH_PAT || github.token }}
      # -------------------------------------------------------
      # 18. Setup urcrypt as sibling to vere
      # -------------------------------------------------------
      - name: Setup urcrypt for vere build
        run: |
          ln -sf $(pwd)/gwbtc-urcrypt $(pwd)/gwbtc-vere/../urcrypt
          ls -la $(pwd)/gwbtc-vere/../urcrypt/
      # -------------------------------------------------------
      # 19. Build gwbtc/vere with zig build
      # -------------------------------------------------------
      - name: Build gwbtc/vere
        run: |
          cd gwbtc-vere
          echo "Building gwbtc/vere with zig build..."
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3..."
            if zig build; then
              echo "Build succeeded on attempt $attempt."
              break
            else
              if [ $attempt -eq 3 ]; then
                echo "All 3 attempts failed. Checking if zlib URL is the issue..."
                ZLIB_URL="https://github.com/allyourcodebase/zlib/archive/61e7df7e996ec5a5f13a653db3c419adb340d6ef.tar.gz"
                HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$ZLIB_URL")
                echo "zlib URL returned HTTP $HTTP_CODE"
                if [ "$HTTP_CODE" != "200" ]; then
                  echo "zlib URL is not reachable. Patching build.zig.zon to use vendored zlib..."
                  mkdir -p ext/zlib-src
                  curl -L -o /tmp/zlib.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
                  tar xzf /tmp/zlib.tar.gz --strip-components=1 -C ext/zlib-src
                  python3 << 'PYEOF'
          import re
          with open('build.zig.zon', 'r') as f:
              content = f.read()
          content = re.sub(
              r'(\.zlib\s*=\s*\.\{)\s*\.url\s*=\s*"[^"]+",\s*\.hash\s*=\s*"[^"]+",',
              r'\1\n            .path = "./ext/zlib-src",',
              content
          )
          with open('build.zig.zon', 'w') as f:
              f.write(content)
          print('Patched build.zig.zon')
          PYEOF
                  echo "Retrying build with vendored zlib..."
                  zig build || { echo "Build failed even with vendored zlib."; exit 1; }
                else
                  echo "zlib URL is reachable but build still failed."
                  exit 1
                fi
              else
                echo "Build failed on attempt $attempt, retrying in 15s..."
                sleep 15
              fi
            fi
          done
          echo "Build complete. Looking for binary..."
          VERE_BIN=$(find zig-out -type f -executable 2>/dev/null | head -1)
          if [ -n "$VERE_BIN" ]; then
            cp "$VERE_BIN" ../gw-vere
          else
            echo "Binary not found in zig-out, searching..."
            find . -name "urbit" -o -name "vere" -type f 2>/dev/null | head -20
            exit 1
          fi
          cd ..
          chmod +x ./gw-vere
          echo "gwbtc/vere built successfully:"
          ls -la ./gw-vere
          file ./gw-vere
          ./gw-vere --version || true
      # -------------------------------------------------------
      # 20. Boot new fakeship with gw-base pill using gwbtc/vere
      # -------------------------------------------------------
      - name: Boot new fakeship with gw-base pill
        env:
          PIER: ./zod2
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          echo "Booting new fakeship with gw-base pill..."
          if [ -f ./gw-base.pill ]; then
            ./gw-vere -d -F zod -B ./gw-base.pill -c zod2
          else
            echo "WARNING: No pill found, booting with default pill."
            ./gw-vere -d -F zod -c zod2
          fi
          echo "Second fakeship boot initiated."
      # -------------------------------------------------------
      # 21. Wait for second fakeship to be idle
      # -------------------------------------------------------
      - name: Wait for second fakeship to be idle
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          FYRD=":*  0
                    %fyrd
                    %base
                    %khan-eval
                    %noun
                    %ted-eval
                    :_  ~
                    '''
                    =/  m  (strand ,vase)
                    (pure:m !>('Success!'))
                    '''
                =="
          echo "Polling second ship until idle..."
          for i in $(seq 1 60); do
            echo "Attempt $i of 60 ($((i * 10))s elapsed)..."
            RESULT=$(echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true)
            echo "Result: $RESULT"
            if echo "$RESULT" | grep -q "%avow"; then
              echo "Second ship is idle and responsive after $((i * 10)) seconds."
              exit 0
            fi
            echo "Ship not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Second ship never became idle after 600 seconds."
          exit 1
      # -------------------------------------------------------
      # 22. Create %groundwire desk on new ship
      # -------------------------------------------------------
      - name: Create groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }
          NEW_DESK_FYRD=":*  0
                             %fyrd
                             %base
                             %khan-eval
                             %noun
                             %ted-eval
                             :_  :~  /sur/spider/hoon
                                     /lib/strandio/hoon
                                 ==
                             '''
                             =/  m  (strand ,vase)
                             ^-  form:m
                             ;<  =beak  bind:m  get-beak
                             ;<  ~  bind:m
                               %:  send-raw-card
                                   %pass   /make-new-desk
                                   %agent  [p.beak %hood]
                                   %poke   %helm-pass
                                   !>  ^-  note-arvo
                                   %^    new-desk:cloy
                                       %groundwire
                                     ~
                                   %-  ~(gas by *(map path page:clay))
                                   |^  =-  (turn - mage)
                                       ^-  (list path)
                                       =/  common-files=(list path)
                                         :~
                                           /mar/noun/hoon
                                           /mar/hoon/hoon
                                           /mar/txt/hoon
                                           /mar/kelvin/hoon
                                           /sys/kelvin
                                         ==
                                       =/  extra-files=(list path)
                                         :~
                                           /mar/bill/hoon
                                           /mar/mime/hoon
                                           /mar/json/hoon
                                           /lib/skeleton/hoon
                                           /lib/default-agent/hoon
                                           /lib/dbug/hoon
                                         ==
                                       (weld common-files extra-files)
                                   ::
                                   ++  mage
                                     |=  =path
                                     :-  path
                                     ^-  page:clay
                                     :-  (rear path)
                                     ~|  [%missing-source-file %base path]
                                     .^  *
                                       %cx
                                       (scot %p p.beak)
                                       %base
                                       (scot %da p.r.beak)
                                       path
                                     ==
                                   --
                               ==
                             (pure:m !>('Created desk!'))
                             '''
                         =="
          echo "Creating groundwire desk..."
          RESULT=$(send_fyrd "$NEW_DESK_FYRD")
          echo "Result: $RESULT"
          sleep 5
      # -------------------------------------------------------
      # 23. Mount %groundwire desk
      # -------------------------------------------------------
      - name: Mount groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }
          MOUNT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  :~  /sur/spider/hoon
                                  /lib/strandio/hoon
                              ==
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  our=@p   bind:m  get-our
                          ;<  now=@da  bind:m  get-time
                          ;<  ~  bind:m
                            %:  poke-our
                                %hood
                                %kiln-mount
                                !>([(en-beam [[our %groundwire [%da now]] /]) %groundwire])
                            ==
                          (pure:m !>(~))
                          '''
                      =="
          echo "Mounting groundwire desk..."
          RESULT=$(send_fyrd "$MOUNT_FYRD")
          sleep 5
          if [ -e "./zod2/groundwire/sys.kelvin" ]; then
            echo "Desk mounted successfully."
            cat ./zod2/groundwire/sys.kelvin
          else
            echo "ERROR: Failed to mount groundwire desk - $RESULT"
          fi
      # -------------------------------------------------------
      # 24. Checkout gwbtc/groundwire and build dependencies
      # -------------------------------------------------------
      - name: Checkout gwbtc/groundwire
        uses: actions/checkout@v3
        with:
          repository: gwbtc/groundwire
          ref: gw/next/kelvin/408
          path: gwbtc-groundwire
          token: ${{ secrets.GH_PAT }}
      - name: Build groundwire dependencies with peru
        run: |
          cd gwbtc-groundwire
          if [ -f build.sh ]; then
            chmod +x build.sh
            bash build.sh
            echo "Build script completed."
          else
            echo "WARNING: No build.sh found. Checking for peru.yaml..."
            if [ -f peru.yaml ]; then
              peru sync
            fi
          fi
          if [ -d dist ]; then
            echo "dist/ directory contents:"
            find dist/ -type f | head -50
            echo "..."
            find dist/ -type f | wc -l
            echo "total files in dist/"
          else
            echo "WARNING: No dist/ directory found after build."
          fi
          cd ..
      # -------------------------------------------------------
      # 25. Copy groundwire dist into mounted desk
      # -------------------------------------------------------
      - name: Copy groundwire dist into mounted desk
        run: |
          if [ -d gwbtc-groundwire/dist ]; then
            echo "Copying groundwire dist/* into mounted groundwire desk..."
            cp -rv gwbtc-groundwire/dist/* ./zod2/groundwire/
            echo "Contents of groundwire desk after copy:"
            find ./zod2/groundwire/ -type f | head -50
            echo "..."
            find ./zod2/groundwire/ -type f | wc -l
            echo "total files"
          else
            echo "ERROR: No dist/ directory to copy from."
            exit 1
          fi
      # -------------------------------------------------------
      # 26. Commit %groundwire desk
      # -------------------------------------------------------
      - name: Commit groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }
          COMMIT_FYRD=":*  0
                          %fyrd
                          %base
                          %khan-eval
                          %noun
                          %ted-eval
                          :_  ~
                          '''
                          =/  m  (strand ,vase)
                          ^-  form:m
                          ;<  ~  bind:m
                            (poke-our %hood %kiln-commit !>([%groundwire %.n]))
                          (pure:m !>('Commit successful!'))
                          '''
                      =="
          echo "Committing groundwire desk..."
          RESULT=$(send_fyrd "$COMMIT_FYRD")
          echo "Result: $RESULT"
          sleep 10
      # -------------------------------------------------------
      # 27. Install %groundwire desk
      # -------------------------------------------------------
      - name: Install groundwire desk
        env:
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          send_fyrd() {
            local FYRD="$1"
            echo "$FYRD" | ./gw-vere eval -jn 2>/dev/null | \
              nc -U -W 3 $CONN_SOCK 2>/dev/null | \
              ./gw-vere eval -cn 2>/dev/null || true
          }
          INSTALL_FYRD=":*  0
                            %fyrd
                            %base
                            %khan-eval
                            %noun
                            %ted-eval
                            :_  ~
                            '''
                            =/  m  (strand ,vase)
                            ^-  form:m
                            ;<  our=@p  bind:m  get-our
                            ;<  ~  bind:m
                              (poke-our %hood %kiln-install !>([%groundwire our %groundwire]))
                            (pure:m !>('Install successful!'))
                            '''
                        =="
          echo "Installing groundwire desk..."
          RESULT=$(send_fyrd "$INSTALL_FYRD")
          echo "Result: $RESULT"
          sleep 10
      # -------------------------------------------------------
      # 28. Validate groundwire desk
      # -------------------------------------------------------
      - name: Validate groundwire desk structure
        run: |
          echo "Validating groundwire desk contents..."
          ls -la ./zod2/groundwire/
          echo "Desk validation complete."
      # -------------------------------------------------------
      # 29. Build & Push Docker Image to DO Registry
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-groundwire:${{ github.sha }} .
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600
      - name: Push image to DigitalOcean Container Registry
        run: |
          docker push registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-groundwire:${{ github.sha }}
      # -------------------------------------------------------
      # 30. Deploy to DigitalOcean Kubernetes
      # -------------------------------------------------------
      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/urbit-groundwire \
            urbit-groundwire=registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/urbit-groundwire:${{ github.sha }}
      # -------------------------------------------------------
      # 31. Cleanup - shut down fakeships
      # -------------------------------------------------------
      - name: Shutdown fakeships
        if: always()
        run: |
          echo "Shutting down fakeships..."
          URBIT_PID2=$(cat ./zod2/.urb/pid 2>/dev/null || true)
          if [ -n "$URBIT_PID2" ]; then
            kill $URBIT_PID2 || true
            echo "Killed second fakeship PID $URBIT_PID2"
          fi
          URBIT_PID=$(cat ./zod/.urb/pid 2>/dev/null || true)
          if [ -n "$URBIT_PID" ]; then
            kill $URBIT_PID || true
            echo "Killed first fakeship PID $URBIT_PID"
          fi
          pkill -f "urbit" || true
          pkill -f "gw-vere" || true
          echo "Done."
