name: Scheduled Build Check
on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC

env:
  URBIT_BRANCH: gw/next/kelvin/408
  GROUNDWIRE_BRANCH: hd/consolidate-urb
  SPV_WALLET_BRANCH: develop
  URCRYPT_BRANCH: gw/cmp-pub
  VERE_BRANCH: gw/next/kelvin/408
  COMET_MINER_BRANCH: tinnus-feed
  URBIT_MCP_BRANCH: main
  URSOCKETS_BRANCH: develop
  TLONDESKS_BRANCH: polwex/tlondesks
  BOOTING_BRANCH: fix/tmux-boot-error-handling

jobs:
  check-and-build:
    name: Check for changes and trigger build
    runs-on: ubuntu-latest
    steps:
      - name: Collect latest commit SHAs from all repos
        id: shas
        run: |
          get_sha() {
            gh api "repos/$1/commits/$2" --jq '.sha' 2>/dev/null || echo "unknown"
          }
          COMBINED=""
          for pair in \
            "gwbtc/urbit:$URBIT_BRANCH" \
            "gwbtc/groundwire:$GROUNDWIRE_BRANCH" \
            "gwbtc/spv-wallet:$SPV_WALLET_BRANCH" \
            "gwbtc/urcrypt:$URCRYPT_BRANCH" \
            "gwbtc/vere:$VERE_BRANCH" \
            "gwbtc/comet-miner:$COMET_MINER_BRANCH" \
            "gwbtc/urbit-mcp:$URBIT_MCP_BRANCH" \
            "gwbtc/ursockets:$URSOCKETS_BRANCH" \
            "gwbtc/ursockets:$TLONDESKS_BRANCH" \
            "gwbtc/booting:$BOOTING_BRANCH"; do
            repo="${pair%%:*}"
            branch="${pair##*:}"
            sha=$(get_sha "$repo" "$branch")
            echo "$repo@$branch: $sha"
            COMBINED="${COMBINED}${sha}"
          done
          HASH=$(echo -n "$COMBINED" | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Combined hash: $HASH"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Restore previous hash
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .last-build-hash
          key: groundwire-build-hash-${{ steps.shas.outputs.hash }}
          restore-keys: groundwire-build-hash-

      - name: Compare and trigger
        run: |
          NEW_HASH="${{ steps.shas.outputs.hash }}"
          if [ -f .last-build-hash ]; then
            OLD_HASH=$(cat .last-build-hash)
            echo "Previous: $OLD_HASH"
            echo "Current:  $NEW_HASH"
            if [ "$OLD_HASH" = "$NEW_HASH" ]; then
              echo "No changes detected. Skipping build."
              exit 0
            fi
          fi
          echo "Changes detected. Triggering build."
          gh workflow run groundwire-build.yml --ref gw/next/kelvin/408
          echo "$NEW_HASH" > .last-build-hash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Save new hash
        uses: actions/cache/save@v4
        with:
          path: .last-build-hash
          key: groundwire-build-hash-${{ steps.shas.outputs.hash }}
